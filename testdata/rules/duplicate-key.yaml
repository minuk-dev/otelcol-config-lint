# duplicate-key: the same mapping key written twice.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: localhost:4317
  otlp: # duplicate-key: the declaration above is silently discarded
    protocols:
      http:
        endpoint: localhost:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  batch:
exporters:
  otlp_grpc:
    endpoint: backend:4317
    sending_queue:
      enabled: false
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_grpc]
