# required-field: a setting the component cannot start without.
receivers:
  otlp: # required-field: the otlp receiver needs "protocols"; with none it enables nothing
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  batch:
exporters:
  otlp_grpc:
    endpoint: backend:4317
    sending_queue:
      enabled: false
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_grpc]
