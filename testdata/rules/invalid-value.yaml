# invalid-value: a setting whose value has the wrong type.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: localhost:4317
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  batch:
exporters:
  otlp_grpc:
    endpoint: backend:4317
    timeout: 5 # invalid-value: a duration needs a unit, so this is not 5 seconds
    sending_queue:
      enabled: false
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_grpc]
