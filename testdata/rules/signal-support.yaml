# signal-support: a receiver wired into a signal it does not carry.
receivers:
  jaeger:
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  batch:
exporters:
  otlp_grpc:
    endpoint: backend:4317
    sending_queue:
      enabled: false
service:
  pipelines:
    metrics:
      receivers: [jaeger] # signal-support: the jaeger receiver carries traces only
      processors: [memory_limiter, batch]
      exporters: [otlp_grpc]
