receivers:
  otlp:
    protocols:
      grpc:
        endpoint: localhost:4317
processors:
  batch:
    send_batch_size: "1024"
    send_batch_max_size: "2048"
exporters:
  otlp:
    endpoint: localhost:4317
    tls:
      insecure: "true"
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp]
