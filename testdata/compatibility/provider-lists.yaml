receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317
processors:
  batch:
    timeout: 5s
exporters:
  debug: {}
extensions: {zpages: {endpoint: localhost:55679}}
service:
  extensions: ${env:COMPAT_EXTENSIONS}
  pipelines:
    traces:
      receivers: ${env:COMPAT_RECEIVERS}
      processors: ${env:COMPAT_PROCESSORS}
      exporters: ${env:COMPAT_EXPORTERS}
