    memory_limiter:
      type: memory_limiter
      signals:
        - traces
        - metrics
        - logs
        - profiles
      stability:
        logs: beta
        metrics: beta
        profiles: alpha
        traces: beta
      module: go.opentelemetry.io/collector/processor/memorylimiterprocessor
      fields:
        type: map
        children:
          check_interval:
            type: duration
            doc: how often memory use is measured; 1s is the usual value
          limit_mib:
            type: int
            doc: hard limit in MiB; above it the processor starts refusing data
          limit_percentage:
            type: int
            doc: hard limit as a percentage of total memory, for containers
          spike_limit_mib:
            type: int
            doc: headroom in MiB reserved for allocation spikes
          spike_limit_percentage:
            type: int
            doc: spike headroom as a percentage of total memory
        required:
          - check_interval
    metrics_transform:
      type: metrics_transform
      signals:
        - metrics
      stability:
        metrics: beta
      module: github.com/open-telemetry/opentelemetry-collector-contrib/processor/metricstransformprocessor
      alias: metricstransform
      fields:
        type: map
        children:
          transforms:
            type: list
            children:
              item:
                type: map
                children:
                  action:
                    type: string
                    doc: Action specifies the action performed on the matched metric. Action specifies if the operations (specified below) are performed on metrics in place (update), on an inserted clone (insert), or on a new combined metric that includes all data points from the set of matching metrics (combine). REQUIRED
                  aggregation_type:
                    type: string
                    doc: AggregationType specifies how to aggregate. REQUIRED only if Action is COMBINE.
                  experimental_match_labels:
                    type: map
                    open: true
                    doc: MatchLabels specifies the label set against which the metric filter will work. This field is optional.
                  group_resource_labels:
                    type: map
                    open: true
                    doc: GroupResourceLabels specifies resource labels that will be appended to this group's new ResourceMetrics message REQUIRED only if Action is GROUP
                  include:
                    type: string
                    doc: Include specifies the metric(s) to operate on.
                  match_type:
                    type: string
                    doc: 'MatchType determines how the Include string is matched: <strict|regexp>.'
                  new_name:
                    type: string
                    doc: NewName specifies the name of the new metric when inserting or updating. REQUIRED only if Action is INSERT.
                  operations:
                    type: list
                    children:
                      item:
                        type: map
                        children:
                          action:
                            type: string
                            doc: Action specifies the action performed for this operation. REQUIRED
                          aggregated_values:
                            type: list
                            children:
                              item:
                                type: string
                            doc: AggregatedValues is a list of label values to aggregate away.
                          aggregation_type:
                            type: string
                            doc: AggregationType specifies how to aggregate.
                          experimental_scale:
                            type: float
                            doc: Scale is a scalar to multiply the values with.
                          label:
                            type: string
                            doc: Label identifies the exact label to operate on.
                          label_set:
                            type: list
                            children:
                              item:
                                type: string
                            doc: LabelSet is a list of labels to keep. All other labels are aggregated based on the AggregationType.
                          label_value:
                            type: string
                            doc: LabelValue identifies the exact label value to operate on
                          new_label:
                            type: string
                            doc: NewLabel determines the name to rename the identified label to.
                          new_value:
                            type: string
                            doc: NewValue is used to set a new label value either when the operation is `AggregatedValues` or `addLabel`.
                          value_actions:
                            type: list
                            children:
                              item:
                                type: map
                                children:
                                  new_value:
                                    type: string
                                    doc: NewValue specifies the label value to rename to.
                                  value:
                                    type: string
                                    doc: Value specifies the current label value.
                            doc: ValueActions is a list of renaming actions for label values.
                    doc: Operations contains a list of operations that will be performed on the resulting metric(s).
                  submatch_case:
                    type: string
                    doc: SubmatchCase specifies what case to use for label values created from regexp submatches.
            doc: transform specifies a list of transforms on metrics with each transform focusing on one metric.
        doc: Config defines configuration for Resource processor.
