                  traces_url_path:
                    type: string
            doc: at least one of grpc or http must be enabled
        required:
          - protocols
    prometheus:
      type: prometheus
      signals:
        - metrics
      stability:
        metrics: beta
      module: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/prometheusreceiver
      fields:
        type: map
        children:
          api_server:
            type: map
            children:
              enabled:
                type: bool
              max_connections:
                type: int
              server_config:
                type: map
                children:
                  auth:
                    type: map
                    children:
                      authenticator:
                        type: map
                        open: true
                        doc: AuthenticatorID specifies the name of the extension to use in order to authenticate the incoming data point.
                      request_params:
                        type: list
                        children:
                          item:
                            type: string
                        doc: RequestParameters is a list of parameters that should be extracted from the request and added to the context. When a parameter is found in both the query string and the header, the value from the query string will be used.
                    doc: Auth for this receiver
                  compression_algorithms:
                    type: list
                    children:
                      item:
                        type: string
                    doc: 'CompressionAlgorithms configures the list of compression algorithms the server can accept. Default: ["", "gzip", "zstd", "zlib", "snappy", "deflate"]'
                  cors:
                    type: map
                    children:
                      allowed_headers:
                        type: list
                        children:
                          item:
                            type: string
                        doc: AllowedHeaders sets what headers will be allowed in CORS requests. The Accept, Accept-Language, Content-Type, and Content-Language headers are implicitly allowed. If no headers are listed, X-Requested-With will also be accepted by default. Include "*" to allow any request header.
                      allowed_origins:
                        type: list
                        children:
                          item:
                            type: string
                        doc: AllowedOrigins sets the allowed values of the Origin header for HTTP/JSON requests to an OTLP receiver. An origin may contain a wildcard (*) to replace 0 or more characters (e.g., "http://*.domain.com", or "*" to allow any origin).
                      exposed_headers:
                        type: list
                        children:
                          item:
                            type: string
                        doc: ExposedHeaders sets the value of the Access-Control-Expose-Headers response header, indicating which headers are safe to expose to the API of a CORS response.
                      max_age:
                        type: int
                        doc: MaxAge sets the value of the Access-Control-Max-Age response header. Set it to the number of seconds that browsers should cache a CORS preflight response for.
                    doc: CORS configures the server for HTTP cross-origin resource sharing (CORS).
                  dialer:
                    type: map
                    children:
                      timeout:
                        type: duration
                  endpoint:
                    type: string
                    doc: Endpoint configures the listening address for the server.
                  idle_timeout:
                    type: duration
                    doc: IdleTimeout is the maximum amount of time to wait for the next request when keep-alives are enabled. If IdleTimeout is zero, the value of ReadTimeout is used. If both are zero, there is no timeout.
                  include_metadata:
                    type: bool
                    doc: IncludeMetadata propagates the client metadata from the incoming requests to the downstream consumers
                  keep_alives_enabled:
                    type: bool
                    doc: KeepAlivesEnabled controls whether HTTP keep-alives are enabled. By default, keep-alives are always enabled. Only very resource-constrained environments should disable them.
                  max_request_body_size:
                    type: int
                    doc: 'MaxRequestBodySize sets the maximum request body size in bytes. Default: 20MiB.'
                  middlewares:
                    type: list
                    children:
                      item:
                        type: map
                        children:
                          id:
                            type: map
                            open: true
                            doc: ID specifies the name of the extension to use.
                        doc: Middleware defines the extension ID for a middleware component.
                    doc: Middlewares are used to add custom functionality to the HTTP server. Middleware handlers are called in the order they appear in this list, with the first middleware becoming the outermost handler.
                  read_header_timeout:
                    type: duration
                    doc: ReadHeaderTimeout is the amount of time allowed to read request headers. The connection's read deadline is reset after reading the headers and the Handler can decide what is considered too slow for the body. If ReadHeaderTimeout is zero, the value of ReadTimeout is used. If both are zero, there is no timeout.
                  read_timeout:
                    type: duration
                    doc: ReadTimeout is the maximum duration for reading the entire request, including the body. A zero or negative value means there will be no timeout. Because ReadTimeout does not let Handlers make per-request decisions on each request body's acceptable deadline or upload rate, most users will prefer to use ReadHeaderTimeout. It is valid to use them both.
                  response_headers:
                    children:
                      item:
                        type: map
                        children:
                          name:
                            type: string
                          value:
                            type: string
                            doc: String alias that is marshaled and printed in an opaque way. To recover the original value, cast it to a string.
                        doc: Pair is an element of a MapList, and consists of a name and an opaque value.
                    doc: Additional headers attached to each HTTP response sent to the client. Header values are opaque since they may be sensitive.
                  tls:
                    type: map
                    children:
                      ca_file:
                        type: string
                        doc: Path to the CA cert. For a client this verifies the server certificate. For a server this verifies client certificates. If empty uses system root CA. (optional)
                      ca_pem:
                        type: string
                        doc: In memory PEM encoded cert. (optional)
                      cert_file:
                        type: string
                        doc: Path to the TLS cert to use for TLS required connections. (optional)
                      cert_pem:
                        type: string
                        doc: In memory PEM encoded TLS cert to use for TLS required connections. (optional)
                      cipher_suites:
                        type: list
                        children:
                          item:
                            type: string
                        doc: CipherSuites is a list of TLS cipher suites that the TLS transport can use. If left blank, a safe default list is used. See https://go.dev/src/crypto/tls/cipher_suites.go for a list of supported cipher suites.
                      client_ca_file:
                        type: string
                        doc: Path to the TLS cert to use by the server to verify a client certificate. (optional) This sets the ClientCAs and ClientAuth to RequireAndVerifyClientCert in the TLSConfig. Please refer to https://godoc.org/crypto/tls#Config for more information. (optional)
                      client_ca_file_reload:
                        type: bool
                        doc: Reload the ClientCAs file when it is modified (optional, default false)
                      curve_preferences:
                        type: list
                        children:
                          item:
                            type: string
                        doc: contains the elliptic curves that will be used in an ECDHE handshake, in preference order Defaults to empty list and "crypto/tls" defaults are used, internally.
                      include_insecure_cipher_suites:
                        type: bool
                      include_system_ca_certs_pool:
                        type: bool
                        doc: If true, load system CA certificates pool in addition to the certificates configured in this struct.
                      key_file:
                        type: string
                        doc: Path to the TLS key to use for TLS required connections. (optional)
                      key_pem:
                        type: string
                        doc: In memory PEM encoded TLS key to use for TLS required connections. (optional)
                      max_version:
                        type: string
                        doc: MaxVersion sets the maximum TLS version that is acceptable. If not set, refer to crypto/tls for defaults. (optional)
                      min_version:
                        type: string
                        doc: MinVersion sets the minimum TLS version that is acceptable. If not set, TLS 1.2 will be used. (optional)
                      reload_interval:
                        type: duration
                        doc: ReloadInterval specifies the duration after which the certificate will be reloaded If not set, it will never be reloaded (optional)
                      tpm:
                        type: map
                        children:
                          auth:
                            type: string
                          enabled:
                            type: bool
                          owner_auth:
                            type: string
                          path:
                            type: string
                            doc: The path to the TPM device or Unix domain socket. For instance /dev/tpm0 or /dev/tpmrm0.
                        doc: Trusted platform module configuration
                    doc: TLS struct exposes TLS client configuration.
                  transport:
                    type: string
                  write_timeout:
                    type: duration
                    doc: WriteTimeout is the maximum duration before timing out writes of the response. It is reset whenever a new request's header is read. Like ReadTimeout, it does not let Handlers make decisions on a per-request basis. A zero or negative value means there will be no timeout.
                doc: ServerConfig defines settings for creating an HTTP server.
            doc: APIServer has the settings to enable the receiver to host the Prometheus API server in agent mode. This allows the user to call the endpoint to get the config, service discovery, and targets for debugging purposes.
