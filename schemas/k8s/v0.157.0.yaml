                            children:
                              key:
                                type: string
                                doc: Tag that the filter is going to be matching against.
                              values:
                                type: list
                                children:
                                  item:
                                    type: string
                                doc: Values indicate the set of values to use when matching against trace_state values.
                            doc: Configs for defining trace_state policy
                          type:
                            type: string
                            doc: Type of the policy this will be used to match the proper configuration of the policy.
                        doc: NotSubPolicyCfg holds the common configuration to the policy under the not policy.
                    doc: Configs for defining not policy
                  numeric_attribute:
                    type: map
                    children:
                      invert_match:
                        type: bool
                        doc: InvertMatch indicates that values must not match against attribute values. If InvertMatch is true and Values is equal to '123', all other values will be sampled except '123'. Also, if the specified Key does not match any resource or span attributes, data will be sampled.
                      key:
                        type: string
                        doc: Tag that the filter is going to be matching against.
                      max_value:
                        type: int
                        doc: MaxValue is the maximum value of the attribute to be considered a match.
                      min_value:
                        type: int
                        doc: MinValue is the minimum value of the attribute to be considered a match.
                    doc: Configs for numeric attribute filter sampling policy evaluator.
                  ottl_condition:
                    type: map
                    children:
                      error_mode:
                        type: string
                        doc: ErrorMode is the way OTTL should handle errors.
                      span:
                        type: list
                        children:
                          item:
                            type: string
                      spanevent:
                        type: list
                        children:
                          item:
                            type: string
                    doc: Configs for OTTL condition filter sampling policy evaluator
                  probabilistic:
                    type: map
                    children:
                      hash_salt:
                        type: string
                        doc: 'HashSalt allows one to configure the hashing salts. This is important in scenarios where multiple layers of collectors have different sampling rates: if they use the same salt all passing one layer may pass the other even if they have different sampling rates, configuring different salts avoids that.'
                      sampling_percentage:
                        type: float
                        doc: 'SamplingPercentage is the percentage rate at which traces are going to be sampled. Defaults to zero, i.e.: no sample. Values greater or equal 100 are treated as "sample all traces".'
                    doc: Configs for probabilistic sampling policy evaluator.
                  rate_limiting:
                    type: map
                    children:
                      burst_capacity:
                        type: int
                        doc: BurstCapacity sets the maximum burst capacity in spans. If not specified, defaults to 2x SpansPerSecond. This allows for short bursts of traffic above the sustained rate. It also acts as a limit for individual trace span counts, a single trace with more spans than the burst size will not pass.
                      spans_per_second:
                        type: int
                        doc: SpansPerSecond sets the limit on the maximum number of spans that can be processed each second.
                    doc: Configs for rate limiting filter sampling policy evaluator.
                  span_count:
                    type: map
                    children:
                      max_spans:
                        type: int
                      min_spans:
                        type: int
                        doc: Minimum number of spans in a Trace
                    doc: Configs for span count filter sampling policy evaluator.
                  status_code:
                    type: map
                    children:
                      status_codes:
                        type: list
                        children:
                          item:
                            type: string
                    doc: Configs for status code filter sampling policy evaluator.
                  string_attribute:
                    type: map
                    children:
                      cache_max_size:
                        type: int
                        doc: CacheMaxSize is the maximum number of attribute entries of LRU Cache that stores the matched result from the regular expressions defined in Values. CacheMaxSize will not be used if EnabledRegexMatching is set to false.
                      enabled_regex_matching:
                        type: bool
                        doc: EnabledRegexMatching determines whether match attribute values by regexp string.
                      invert_match:
                        type: bool
                        doc: InvertMatch indicates that values or regular expressions must not match against attribute values. If InvertMatch is true and Values is equal to 'acme', all other values will be sampled except 'acme'. Also, if the specified Key does not match on any resource or span attributes, data will be sampled.
                      key:
                        type: string
                        doc: Tag that the filter is going to be matching against.
                      values:
                        type: list
                        children:
                          item:
                            type: string
                        doc: Values indicate the set of values or regular expressions to use when matching against attribute values. StringAttribute Policy will apply exact value match on Values unless EnabledRegexMatching is true.
                    doc: Configs for string attribute filter sampling policy evaluator.
                  trace_state:
                    type: map
                    children:
                      key:
                        type: string
                        doc: Tag that the filter is going to be matching against.
                      values:
                        type: list
                        children:
                          item:
                            type: string
                        doc: Values indicate the set of values to use when matching against trace_state values.
                    doc: Configs for defining trace_state policy
                  type:
                    type: string
                    doc: Type of the policy this will be used to match the proper configuration of the policy.
                doc: PolicyCfg holds the common configuration to all policies.
            doc: PolicyCfgs sets the tail-based sampling policy which makes a sampling decision for a given trace when requested.
          sample_on_first_match:
            type: bool
            doc: Make decision as soon as a policy matches
          sampling_strategy:
            type: string
            doc: SamplingStrategy controls how/when sampling decisions are made. "trace-complete" (default) evaluates accumulated trace data on timer handling. "span-ingest" evaluates each incoming batch on ingest; terminal outcomes finalize immediately, and non-terminal traces are finalized on cleanup.
          tail_storage:
            type: map
            open: true
            doc: TailStorageID specifies an optional tail storage extension to use for buffering spans. If not set, in-memory tail storage is used. It is behind feature gate `processor.tailsamplingprocessor.tailstorageextension`.
        doc: Config holds the configuration for tail-based sampling.
