                    type: string
                doc: SpanEventConditions is a list of OTTL conditions for an ottlspanevent context. If any condition resolves to true, the span event will be dropped. Supports `and`, `or`, and `()`
            doc: 'Deprecated: use TraceConditions instead.'
        doc: Config defines configuration for Resource processor.
    groupbyattrs:
      type: groupbyattrs
      signals:
        - traces
        - metrics
        - logs
      stability:
        logs: beta
        metrics: beta
        traces: beta
      module: github.com/open-telemetry/opentelemetry-collector-contrib/processor/groupbyattrsprocessor
      fields:
        type: map
        children:
          keys:
            type: list
            children:
              item:
                type: string
            doc: GroupByKeys describes the attribute names that are going to be used for grouping. Empty value is allowed, since processor in such case can compact data
        doc: Config is the configuration for the processor.
    groupbytrace:
      type: groupbytrace
      signals:
        - traces
      stability:
        traces: beta
      module: github.com/open-telemetry/opentelemetry-collector-contrib/processor/groupbytraceprocessor
      fields:
        type: map
        children:
          discard_orphans:
            type: bool
            doc: 'DiscardOrphans instructs the processor to discard traces without the root span. This typically indicates that the trace is incomplete. Default: false. Not yet implemented, and an error will be returned when this option is used.'
          num_traces:
            type: int
            doc: 'NumTraces is the max number of traces to keep in memory waiting for the duration. Default: 1_000_000.'
          num_workers:
            type: int
            doc: 'NumWorkers is a number of workers processing event queue. Default: 1.'
          store_on_disk:
            type: bool
            doc: 'StoreOnDisk tells the processor to keep only the trace ID in memory, serializing the trace spans to disk. Useful when the duration to wait for traces to complete is high. Default: false. Not yet implemented, and an error will be returned when this option is used.'
          wait_duration:
            type: duration
            doc: 'WaitDuration tells the processor to wait for the specified duration for the trace to be complete. Default: 1s.'
        doc: Config is the configuration for the processor.
    interval:
      type: interval
      signals:
        - metrics
      stability:
        metrics: alpha
      module: github.com/open-telemetry/opentelemetry-collector-contrib/processor/intervalprocessor
      fields:
        type: map
        children:
          interval:
            type: duration
            doc: Interval is the time interval at which the processor will aggregate metrics.
          pass_through:
            type: map
            children:
              gauge:
                type: bool
                doc: Gauge is a flag that determines whether gauge metrics should be passed through as they are or aggregated.
              summary:
                type: bool
                doc: Summary is a flag that determines whether summary metrics should be passed through as they are or aggregated.
            doc: PassThrough is a configuration that determines whether gauge and summary metrics should be passed through as they are or aggregated.
        doc: Config defines the configuration for the processor.
    k8s_attributes:
      type: k8s_attributes
      signals:
        - traces
        - metrics
        - logs
        - profiles
      stability:
        logs: beta
        metrics: beta
        profiles: development
        traces: beta
      module: github.com/open-telemetry/opentelemetry-collector-contrib/processor/k8sattributesprocessor
      alias: k8sattributes
      fields:
        type: map
        children:
          auth_type:
            type: string
            doc: How to authenticate to the K8s API server.  This can be one of `none` (for no auth), `serviceAccount` (to use the standard service account token provided to the agent pod), or `kubeConfig` to use credentials from `~/.kube/config`.
          context:
            type: string
            doc: When using auth_type `kubeConfig`, override the current context.
          exclude:
            type: map
            children:
              pods:
                type: list
                children:
                  item:
                    type: map
                    children:
                      name:
                        type: string
                    doc: ExcludePodConfig represent a Pod name to ignore
            doc: Exclude section allows to define names of pod that should be ignored while tagging.
          extract:
            type: map
            children:
              annotations:
                type: list
                children:
                  item:
                    type: map
                    children:
                      from:
                        type: string
                        doc: From represents the source of the labels/annotations. Allowed values are "pod", "namespace", "node", "deployment", "statefulset", "daemonset", and "job". The default is pod.
                      key:
                        type: string
                        doc: Key represents the annotation (or label) name. This must exactly match an annotation (or label) name.
                      key_regex:
                        type: string
                        doc: KeyRegex is a regular expression used to extract a Key that matches the regex. Out of Key or KeyRegex, only one option is expected to be configured at a time.
                      tag_name:
                        type: string
                        doc: 'TagName represents the name of the resource attribute that will be added to logs, metrics or spans. When not specified, a default tag name will be used of the format: - k8s.pod.annotations.<annotation key>  (or k8s.pod.annotation.<annotation key> when processor.k8sattributes.EmitV1K8sConventions is enabled) - k8s.pod.labels.<label key>  (or k8s.pod.label.<label key> when processor.k8sattributes.EmitV1K8sConventions is enabled) For example, if tag_name is not specified and the key is git_sha, then the attribute name will be `k8s.pod.annotations.git_sha` (or `k8s.pod.annotation.git_sha` with the feature gate). When key_regex is present, tag_name supports back reference to both named capturing and positioned capturing. For example, if your pod spec contains the following labels, app.kubernetes.io/component: mysql app.kubernetes.io/version: 5.7.21 and you''d like to add tags for all labels with prefix app.kubernetes.io/ and also trim the prefix, then you can specify the following extraction rules: extract: labels: - tag_name: $$1 key_regex: kubernetes.io/(.*) this will add the `component` and `version` tags to the spans or metrics. When key_regex is present without tag_name, the default tag name format will be used for each matched key. For example: extract: labels: - key_regex: environment\.(.*) from: pod If labels like "environment.prod" and "environment.dev" exist, they will be extracted as k8s.pod.labels.environment.prod and k8s.pod.labels.environment.dev respectively.'
                    doc: FieldExtractConfig allows specifying an extraction rule to extract a resource attribute from pod (or namespace) annotations (or labels).
                doc: Annotations allows extracting data from pod annotations and record it as resource attributes. It is a list of FieldExtractConfig type. See FieldExtractConfig documentation for more details.
              deployment_name_from_replicaset:
                type: bool
                doc: 'DeploymentNameFromReplicaSet allows extracting deployment name from ReplicaSet name by trimming pod template hash. Deprecated: This option now defaults to true and will be removed in future releases.'
              labels:
                type: list
                children:
                  item:
                    type: map
                    children:
                      from:
                        type: string
                        doc: From represents the source of the labels/annotations. Allowed values are "pod", "namespace", "node", "deployment", "statefulset", "daemonset", and "job". The default is pod.
                      key:
                        type: string
                        doc: Key represents the annotation (or label) name. This must exactly match an annotation (or label) name.
                      key_regex:
                        type: string
                        doc: KeyRegex is a regular expression used to extract a Key that matches the regex. Out of Key or KeyRegex, only one option is expected to be configured at a time.
                      tag_name:
                        type: string
                        doc: 'TagName represents the name of the resource attribute that will be added to logs, metrics or spans. When not specified, a default tag name will be used of the format: - k8s.pod.annotations.<annotation key>  (or k8s.pod.annotation.<annotation key> when processor.k8sattributes.EmitV1K8sConventions is enabled) - k8s.pod.labels.<label key>  (or k8s.pod.label.<label key> when processor.k8sattributes.EmitV1K8sConventions is enabled) For example, if tag_name is not specified and the key is git_sha, then the attribute name will be `k8s.pod.annotations.git_sha` (or `k8s.pod.annotation.git_sha` with the feature gate). When key_regex is present, tag_name supports back reference to both named capturing and positioned capturing. For example, if your pod spec contains the following labels, app.kubernetes.io/component: mysql app.kubernetes.io/version: 5.7.21 and you''d like to add tags for all labels with prefix app.kubernetes.io/ and also trim the prefix, then you can specify the following extraction rules: extract: labels: - tag_name: $$1 key_regex: kubernetes.io/(.*) this will add the `component` and `version` tags to the spans or metrics. When key_regex is present without tag_name, the default tag name format will be used for each matched key. For example: extract: labels: - key_regex: environment\.(.*) from: pod If labels like "environment.prod" and "environment.dev" exist, they will be extracted as k8s.pod.labels.environment.prod and k8s.pod.labels.environment.dev respectively.'
                    doc: FieldExtractConfig allows specifying an extraction rule to extract a resource attribute from pod (or namespace) annotations (or labels).
                doc: Labels allows extracting data from pod labels and record it as resource attributes. It is a list of FieldExtractConfig type. See FieldExtractConfig documentation for more details.
              metadata:
                type: list
                children:
                  item:
                    type: string
                doc: 'Metadata allows to extract pod/namespace/node metadata from a list of metadata fields. The field accepts a list of strings. Metadata fields supported right now are, k8s.pod.name, k8s.pod.uid, k8s.deployment.name, k8s.node.name, k8s.namespace.name, k8s.pod.start_time, k8s.replicaset.name, k8s.replicaset.uid, k8s.daemonset.name, k8s.daemonset.uid, k8s.job.name, k8s.job.uid, k8s.cronjob.name, k8s.cronjob.uid, k8s.statefulset.name, k8s.statefulset.uid, k8s.container.name, container.id, container.image.name, container.image.tag, container.image.repo_digests k8s.cluster.uid Specifying anything other than these values will result in an error. By default, the following fields are extracted and added to spans, metrics and logs as resource attributes: - k8s.pod.name - k8s.pod.uid - k8s.pod.start_time - k8s.namespace.name - k8s.node.name - k8s.deployment.name (if the pod is controlled by a deployment) - k8s.container.name (requires an additional attribute to be set: container.id) - container.image.name (requires one of the following additional attributes to be set: container.id or k8s.container.name) - container.image.tag (requires one of the following additional attributes to be set: container.id or k8s.container.name) — deprecated, use container.image.tags - container.image.tags (requires one of the following additional attributes to be set: container.id or k8s.container.name)'
              otel_annotations:
                type: bool
                doc: OtelAnnotations extracts all pod annotations with the prefix "resource.opentelemetry.io" as resource attributes E.g. "resource.opentelemetry.io/foo" becomes "foo"
            doc: Extract section allows specifying extraction rules to extract data from k8s pod specs
          filter:
            type: map
            children:
              fields:
                type: list
                children:
                  item:
                    type: map
                    children:
                      key:
                        type: string
                        doc: Key represents the key or name of the field or labels that a filter can apply on.
                      op:
                        type: string
                        doc: 'Op represents the filter operation to apply on the given Key: Value pair. The following operations are supported equals, not-equals, exists, does-not-exist.'
                      value:
                        type: string
                        doc: Value represents the value associated with the key that a filter operation specified by the `Op` field applies on.
                    doc: FieldFilterConfig allows specifying exactly one filter by a field. It can be used to represent a label or generic field filter.
                doc: 'Fields allows to filter pods by generic k8s fields. Only the following operations are supported: - equals - not-equals Check FieldFilterConfig for more details.'
              labels:
                type: list
                children:
                  item:
                    type: map
                    children:
                      key:
                        type: string
                        doc: Key represents the key or name of the field or labels that a filter can apply on.
                      op:
                        type: string
                        doc: 'Op represents the filter operation to apply on the given Key: Value pair. The following operations are supported equals, not-equals, exists, does-not-exist.'
                      value:
                        type: string
                        doc: Value represents the value associated with the key that a filter operation specified by the `Op` field applies on.
                    doc: FieldFilterConfig allows specifying exactly one filter by a field. It can be used to represent a label or generic field filter.
                doc: 'Labels allows to filter pods by generic k8s pod labels. Only the following operations are supported: - equals - not-equals - exists - not-exists Check FieldFilterConfig for more details.'
              namespace:
                type: string
                doc: Namespace filters all pods by the provided namespace. All other pods are ignored.
              node:
                type: string
                doc: Node represents a k8s node or host. If specified, any pods not running on the specified node will be ignored by the tagger.
              node_from_env_var:
                type: string
                doc: 'NodeFromEnv can be used to extract the node name from an environment variable. The value must be the name of the environment variable. This is useful when the node a Otel agent will run on cannot be predicted. In such cases, the Kubernetes downward API can be used to add the node name to each pod as an environment variable. K8s tagger can then read this value and filter pods by it. For example, node name can be passed to each agent with the downward API as follows env: - name: K8S_NODE_NAME valueFrom: fieldRef: fieldPath: spec.nodeName Then the NodeFromEnv field can be set to `K8S_NODE_NAME` to filter all pods by the node that the agent is running on. More on downward API here: https://kubernetes.io/docs/tasks/inject-data-application/environment-variable-expose-pod-information/'
            doc: Filter section allows specifying filters to filter pods by labels, fields, namespaces, nodes, etc.
          kube_api_burst:
            type: int
            doc: KubeAPIBurst is the maximum burst of requests to the Kubernetes API. Uses client-go's default (10) if unset. Increase if you see client-side throttling warnings.
          kube_api_qps:
            type: float
            doc: KubeAPIQPS is the maximum number of queries per second to the Kubernetes API. Uses client-go's default (5) if unset. Increase if you see client-side throttling warnings.
          passthrough:
            type: bool
            doc: Passthrough mode only annotates resources with the pod IP and does not try to extract any other metadata. It does not need access to the K8S cluster API. Agent/Collector must receive spans directly from services to be able to correctly detect the pod IPs.
          pod_association:
            type: list
            children:
              item:
                type: map
                children:
                  sources:
                    type: list
                    children:
                      item:
                        type: map
                        children:
                          from:
                            type: string
                            doc: From represents the source of the association. Allowed values are "connection" and "resource_attribute".
                          name:
                            type: string
                            doc: Name represents extracted key name. e.g. ip, pod_uid, k8s.pod.ip
                    doc: List of pod association sources which should be taken to identify pod
                doc: PodAssociationConfig contain single rule how to associate Pod metadata with logs, spans and metrics
            doc: Association section allows to define rules for tagging spans, metrics, and logs with Pod metadata.
          pod_delete_grace_period:
            type: duration
            doc: PodDeleteGracePeriod is the duration to wait before deleting a pod from the cache after receiving a delete event.
          wait_for_metadata:
            type: bool
            doc: WaitForMetadata is a flag that determines if the processor should wait k8s metadata to be synced when starting.
          wait_for_metadata_timeout:
            type: duration
            doc: WaitForMetadataTimeout is the maximum time the processor will wait for the k8s metadata to be synced.
          watch_sync_period:
            type: duration
            doc: WatchSyncPeriod determines the resync period for K8s informers. Reprocessing the informer cache periodically can cause significant memory churn and CPU spikes. Setting this to 0 disables resync.
        doc: Config defines configuration for k8s attributes processor.
