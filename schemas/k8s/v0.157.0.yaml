    kubelet_stats:
      type: kubelet_stats
      signals:
        - metrics
      stability:
        metrics: beta
      module: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/kubeletstatsreceiver
      alias: kubeletstats
      fields:
        type: map
        children:
          auth_type:
            type: string
            doc: How to authenticate to the K8s API server.  This can be one of `none` (for no auth), `serviceAccount` (to use the standard service account token provided to the agent pod), or `kubeConfig` to use credentials from `~/.kube/config`.
          ca_file:
            type: string
            doc: Path to the CA cert. For a client this verifies the server certificate. For a server this verifies client certificates. If empty uses system root CA. (optional)
          ca_pem:
            type: string
            doc: In memory PEM encoded cert. (optional)
          cert_file:
            type: string
            doc: Path to the TLS cert to use for TLS required connections. (optional)
          cert_pem:
            type: string
            doc: In memory PEM encoded TLS cert to use for TLS required connections. (optional)
          cipher_suites:
            type: list
            children:
              item:
                type: string
            doc: CipherSuites is a list of TLS cipher suites that the TLS transport can use. If left blank, a safe default list is used. See https://go.dev/src/crypto/tls/cipher_suites.go for a list of supported cipher suites.
          collect_all_network_interfaces:
            type: map
            children:
              node:
                type: bool
              pod:
                type: bool
            doc: NetworkCollectAllInterfaces allows to enable collecting metrics from all network interfaces instead of default one Can be set separately for Pod and Node network metrics
          collection_interval:
            type: duration
            doc: CollectionInterval sets how frequently the scraper should be called and used as the context timeout to ensure that scrapers don't exceed the interval.
          context:
            type: string
            doc: When using auth_type `kubeConfig`, override the current context.
          curve_preferences:
            type: list
            children:
              item:
                type: string
            doc: contains the elliptic curves that will be used in an ECDHE handshake, in preference order Defaults to empty list and "crypto/tls" defaults are used, internally.
          dialer:
            type: map
            children:
              timeout:
                type: duration
                doc: Timeout is the maximum amount of time a dial will wait for a connect to complete. The default is no timeout.
            doc: DialerConfig contains options for connecting to an address.
          endpoint:
            type: string
            doc: Endpoint configures the address for this network connection. The address has the form "host:port". The host must be a literal IP address, or a host name that can be resolved to IP addresses. The port must be a literal port number or a service name. If the host is a literal IPv6 address it must be enclosed in square brackets, as in "[2001:db8::1]:80" or "[fe80::1%zone]:80". The zone specifies the scope of the literal IPv6 address as defined in RFC 4007.
          extra_metadata_labels:
            type: list
            children:
              item:
                type: string
            doc: ExtraMetadataLabels contains list of extra metadata that should be taken from /pods endpoint and put as extra labels on metrics resource. No additional metadata is fetched by default, so there are no extra calls to /pods endpoint. Supported values include container.id and k8s.volume.type.
          include_insecure_cipher_suites:
            type: bool
          include_system_ca_certs_pool:
            type: bool
            doc: If true, load system CA certificates pool in addition to the certificates configured in this struct.
          initial_delay:
            type: duration
            doc: InitialDelay sets the initial start delay for the scraper, any non positive value is assumed to be immediately.
          insecure_skip_verify:
            type: bool
            doc: InsecureSkipVerify controls whether the client verifies the server's certificate chain and host name.
          k8s_api_config:
            type: map
            children:
              auth_type:
                type: string
                doc: How to authenticate to the K8s API server.  This can be one of `none` (for no auth), `serviceAccount` (to use the standard service account token provided to the agent pod), or `kubeConfig` to use credentials from `~/.kube/config`.
              context:
                type: string
                doc: When using auth_type `kubeConfig`, override the current context.
              kube_api_burst:
                type: int
                doc: KubeAPIBurst is the maximum burst of requests to the Kubernetes API. Uses client-go's default (10) if unset. Increase if you see client-side throttling warnings.
              kube_api_qps:
                type: float
                doc: KubeAPIQPS is the maximum number of queries per second to the Kubernetes API. Uses client-go's default (5) if unset. Increase if you see client-side throttling warnings.
            doc: Configuration of the Kubernetes API client.
          key_file:
            type: string
            doc: Path to the TLS key to use for TLS required connections. (optional)
          key_pem:
            type: string
            doc: In memory PEM encoded TLS key to use for TLS required connections. (optional)
          kube_api_burst:
            type: int
            doc: KubeAPIBurst is the maximum burst of requests to the Kubernetes API. Uses client-go's default (10) if unset. Increase if you see client-side throttling warnings.
          kube_api_qps:
            type: float
            doc: KubeAPIQPS is the maximum number of queries per second to the Kubernetes API. Uses client-go's default (5) if unset. Increase if you see client-side throttling warnings.
          max_version:
            type: string
            doc: MaxVersion sets the maximum TLS version that is acceptable. If not set, refer to crypto/tls for defaults. (optional)
          metric_groups:
            type: list
            children:
              item:
                type: string
