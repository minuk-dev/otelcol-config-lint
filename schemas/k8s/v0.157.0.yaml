                                doc: Configs for any extensions that are used.
                              boolean_attribute:
                                type: map
                                children:
                                  invert_match:
                                    type: bool
                                    doc: InvertMatch indicates that values must not match against attribute values. If InvertMatch is true and Values is equal to 'true', all other values will be sampled except 'true'. Also, if the specified Key does not match any resource or span attributes, data will be sampled.
                                  key:
                                    type: string
                                    doc: Tag that the filter is going to be matching against.
                                  value:
                                    type: bool
                                    doc: Value indicate the bool value, either true or false to use when matching against attribute values. BooleanAttribute Policy will apply exact value match on Value
                                doc: Configs for boolean attribute filter sampling policy evaluator.
                              bytes_limiting:
                                type: map
                                children:
                                  burst_capacity:
                                    type: int
                                    doc: BurstCapacity sets the maximum burst capacity in bytes. If not specified, defaults to 2x BytesPerSecond. This allows for short bursts of traffic above the sustained rate. It also acts as a limit for individual trace sizes, a single trace larger than the burst size will not pass.
                                  bytes_per_second:
                                    type: int
                                    doc: BytesPerSecond sets the limit on the maximum number of bytes that can be processed each second.
                                doc: Configs for bytes limiting filter sampling policy evaluator.
                              latency:
                                type: map
                                children:
                                  threshold_ms:
                                    type: int
                                    doc: Lower bound in milliseconds. Retaining original name for compatibility
                                  upper_threshold_ms:
                                    type: int
                                    doc: Upper bound in milliseconds.
                                doc: Configs for latency filter sampling policy evaluator.
