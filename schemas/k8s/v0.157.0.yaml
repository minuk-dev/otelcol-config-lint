    probabilistic_sampler:
      type: probabilistic_sampler
      signals:
        - traces
        - logs
      stability:
        logs: alpha
        traces: beta
      module: github.com/open-telemetry/opentelemetry-collector-contrib/processor/probabilisticsamplerprocessor
      fields:
        type: map
        children:
          attribute_source:
            type: string
          fail_closed:
            type: bool
            doc: FailClosed indicates to not sample data (the processor will fail "closed") in case of error, such as failure to parse the tracestate field or missing the randomness attribute. By default, failure cases are sampled (the processor is fails "open").  Sampling priority-based decisions are made after FailClosed is processed, making it possible to sample despite errors using priority.
          from_attribute:
            type: string
            doc: FromAttribute (logs only) The optional name of a log record attribute used for sampling purposes, such as a unique log record ID. The value of the attribute is only used if the trace ID is absent or if `attribute_source` is set to `record`.
          hash_seed:
            type: int
            doc: 'HashSeed allows one to configure the hashing seed. This is important in scenarios where multiple layers of collectors have different sampling rates: if they use the same seed all passing one layer may pass the other even if they have different sampling rates, configuring different seeds avoids that.'
          mode:
            type: string
            doc: 'Mode selects the sampling behavior. Supported values: - "hash_seed": the legacy behavior of this processor. Using an FNV hash combined with the HashSeed value, this sampler performs a non-consistent probabilistic downsampling.  The number of spans output is expected to equal SamplingPercentage (as a ratio) times the number of spans inpout, assuming good behavior from FNV and good entropy in the hashed attributes or TraceID. - "equalizing": Using an OTel-specified consistent sampling mechanism, this sampler selectively reduces the effective sampling probability of arriving spans.  This can be useful to select a small fraction of complete traces from a stream with mixed sampling rates.  The rate of spans passing through depends on how much sampling has already been applied.  If an arriving span was head sampled at the same probability it passes through.  If the span arrives with lower probability, a warning is logged because it means this sampler is configured with too large a sampling probability to ensure complete traces. - "proportional": Using an OTel-specified consistent sampling mechanism, this sampler reduces the effective sampling probability of each span by `SamplingProbability`.'
          sampling_percentage:
            type: float
            doc: 'SamplingPercentage is the percentage rate at which traces or logs are going to be sampled. Defaults to zero, i.e.: no sample. Values greater or equal 100 are treated as "sample all traces/logs".'
          sampling_precision:
            type: int
            doc: SamplingPrecision is how many hex digits of sampling threshold will be encoded, from 1 up to 14.  Default is 4. 0 is treated as full precision.
          sampling_priority:
            type: string
            doc: SamplingPriority (logs only) enables using a log record attribute as the sampling priority of the log record.
        doc: Config has the configuration guiding the sampler processor.
    redaction:
      type: redaction
      signals:
        - traces
        - metrics
        - logs
      stability:
        logs: alpha
        metrics: alpha
        traces: beta
      module: github.com/open-telemetry/opentelemetry-collector-contrib/processor/redactionprocessor
      fields:
        type: map
        children:
          allow_all_keys:
            type: bool
            doc: AllowAllKeys is a flag to allow all span attribute keys. Setting this to true disables the AllowedKeys list. The list of BlockedValues is applied regardless. If you just want to block values, set this to true.
          allowed_keys:
            type: list
            children:
              item:
                type: string
            doc: AllowedKeys is a list of allowed span attribute keys. Span attributes not on the list are removed. The list fails closed if it's empty. To allow all keys, you should explicitly set AllowAllKeys
          allowed_values:
            type: list
            children:
              item:
                type: string
            doc: AllowedValues is a list of regular expressions for allowing values of blocked span attributes. Values that match are not masked.
          blocked_key_patterns:
            type: list
            children:
              item:
                type: string
            doc: BlockedKeyPatterns is a list of blocked span attribute key patterns. Span attributes matching the regexes on the list are masked.
          blocked_values:
            type: list
            children:
              item:
                type: string
            doc: BlockedValues is a list of regular expressions for blocking values of allowed span attributes. Values that match are masked.
          db_sanitizer:
            type: map
            children:
              es:
                type: map
                children:
                  attributes:
                    type: list
                    children:
                      item:
                        type: string
                    doc: Attributes specifies which attribute keys to apply Elasticsearch sanitization to. If empty, Elasticsearch sanitization is applied to all string values in log bodies but not to span/metric attributes
                  enabled:
                    type: bool
              memcached:
                type: map
                children:
                  attributes:
                    type: list
                    children:
                      item:
                        type: string
                    doc: Attributes specifies which attribute keys to apply Memcached sanitization to. If empty, Memcached sanitization is applied to all string values in log bodies but not to span/metric attributes
                  enabled:
                    type: bool
              mongo:
                type: map
                children:
                  attributes:
                    type: list
                    children:
                      item:
                        type: string
                    doc: Attributes specifies which attribute keys to apply MongoDB sanitization to. If empty, MongoDB sanitization is applied to all string values in log bodies but not to span/metric attributes
                  enabled:
                    type: bool
              opensearch:
                type: map
                children:
                  attributes:
                    type: list
                    children:
                      item:
                        type: string
                    doc: Attributes specifies which attribute keys to apply OpenSearch sanitization to. If empty, OpenSearch sanitization is applied to all string values in log bodies but not to span/metric attributes
                  enabled:
                    type: bool
              redis:
                type: map
                children:
                  attributes:
                    type: list
                    children:
                      item:
                        type: string
                    doc: Attributes specifies which attribute keys to apply Redis sanitization to. If empty, Redis sanitization is applied to all string values in log bodies but not to span/metric attributes
                  enabled:
                    type: bool
              sanitize_span_name:
                type: bool
              sql:
                type: map
                children:
                  attributes:
                    type: list
                    children:
                      item:
                        type: string
                    doc: Attributes specifies which attribute keys to apply SQL sanitization to. If empty, SQL sanitization is applied to all string values in log bodies but not to span/metric attributes
                  enabled:
                    type: bool
              valkey:
                type: map
                children:
                  attributes:
                    type: list
                    children:
                      item:
                        type: string
                    doc: Attributes specifies which attribute keys to apply Valkey sanitization to. If empty, Valkey sanitization is applied to all string values in log bodies but not to span/metric attributes
                  enabled:
                    type: bool
            doc: DBSanitizer is a flag to enable database query sanitization.
          hash_function:
            type: string
            doc: HashFunction defines the function for hashing the values instead of masking them with a fixed string. By default, no hash function is used and masking with a fixed string is performed.
          hmac_key:
            type: string
            doc: 'HMACKey is the secret key used for HMAC hashing when HashFunction is set to hmac-sha256 or hmac-sha512. This should be loaded from a secure source like environment variables. Minimum length: 32 bytes for HMAC-SHA256, 64 bytes for HMAC-SHA512.'
          ignored_key_patterns:
            type: list
            children:
              item:
                type: string
            doc: IgnoredKeyPatterns is a list of attribute key patterns (regex) that are not redacted. attributes matching any of these patterns are allowed to pass through the filter without their values being checked or modified.
          ignored_keys:
            type: list
            children:
              item:
                type: string
            doc: IgnoredKeys is a list of span attribute keys that are not redacted. Span attributes in this list are allowed to pass through the filter without being changed or removed.
          redact_all_types:
            type: bool
            doc: RedactAllTypes of attributes, including those that are not string, by converting to a string representation. By default only string values are redacted.
          summary:
            type: string
            doc: Summary controls the verbosity level of the diagnostic attributes that the processor adds to the spans when it redacts or masks other attributes. In some contexts a list of redacted attributes leaks information, while it is valuable when integrating and testing a new configuration. Possible values are `debug`, `info`, and `silent`.
          url_sanitizer:
            type: map
            children:
              attributes:
                type: list
                children:
                  item:
                    type: string
                doc: Attributes is the list of attributes that will be sanitized.
              enabled:
                type: bool
              sanitize_span_name:
                type: bool
                doc: SanitizeSpanName controls whether span names should be sanitized.
            doc: URLSanitization is a flag to sanitize URLs by removing UUIDs, timestamps, and other non-essential information
    remotetap:
      type: remotetap
      signals:
        - traces
        - metrics
        - logs
      stability:
        logs: alpha
        metrics: alpha
        traces: alpha
      module: github.com/open-telemetry/opentelemetry-collector-contrib/processor/remotetapprocessor
      fields:
        type: map
        children:
          auth:
            type: map
            children:
              authenticator:
                type: map
                open: true
                doc: AuthenticatorID specifies the name of the extension to use in order to authenticate the incoming data point.
              request_params:
                type: list
                children:
                  item:
                    type: string
                doc: RequestParameters is a list of parameters that should be extracted from the request and added to the context. When a parameter is found in both the query string and the header, the value from the query string will be used.
            doc: Auth for this receiver
          compression_algorithms:
            type: list
            children:
              item:
                type: string
            doc: 'CompressionAlgorithms configures the list of compression algorithms the server can accept. Default: ["", "gzip", "zstd", "zlib", "snappy", "deflate"]'
          cors:
            type: map
            children:
              allowed_headers:
                type: list
                children:
                  item:
                    type: string
                doc: AllowedHeaders sets what headers will be allowed in CORS requests. The Accept, Accept-Language, Content-Type, and Content-Language headers are implicitly allowed. If no headers are listed, X-Requested-With will also be accepted by default. Include "*" to allow any request header.
              allowed_origins:
                type: list
                children:
                  item:
                    type: string
                doc: AllowedOrigins sets the allowed values of the Origin header for HTTP/JSON requests to an OTLP receiver. An origin may contain a wildcard (*) to replace 0 or more characters (e.g., "http://*.domain.com", or "*" to allow any origin).
              exposed_headers:
                type: list
                children:
                  item:
                    type: string
                doc: ExposedHeaders sets the value of the Access-Control-Expose-Headers response header, indicating which headers are safe to expose to the API of a CORS response.
              max_age:
                type: int
                doc: MaxAge sets the value of the Access-Control-Max-Age response header. Set it to the number of seconds that browsers should cache a CORS preflight response for.
            doc: CORS configures the server for HTTP cross-origin resource sharing (CORS).
          dialer:
            type: map
            children:
              timeout:
                type: duration
          endpoint:
            type: string
            doc: Endpoint configures the listening address for the server.
          idle_timeout:
            type: duration
            doc: IdleTimeout is the maximum amount of time to wait for the next request when keep-alives are enabled. If IdleTimeout is zero, the value of ReadTimeout is used. If both are zero, there is no timeout.
          include_metadata:
            type: bool
            doc: IncludeMetadata propagates the client metadata from the incoming requests to the downstream consumers
          keep_alives_enabled:
            type: bool
            doc: KeepAlivesEnabled controls whether HTTP keep-alives are enabled. By default, keep-alives are always enabled. Only very resource-constrained environments should disable them.
          limit:
            type: map
            open: true
            doc: Limit is a float that indicates the maximum number of messages repeated through the websocket by this processor in messages per second. Defaults to 1.
          max_request_body_size:
            type: int
            doc: 'MaxRequestBodySize sets the maximum request body size in bytes. Default: 20MiB.'
          middlewares:
            type: list
            children:
              item:
                type: map
                children:
                  id:
                    type: map
                    open: true
                    doc: ID specifies the name of the extension to use.
                doc: Middleware defines the extension ID for a middleware component.
            doc: Middlewares are used to add custom functionality to the HTTP server. Middleware handlers are called in the order they appear in this list, with the first middleware becoming the outermost handler.
          read_header_timeout:
            type: duration
            doc: ReadHeaderTimeout is the amount of time allowed to read request headers. The connection's read deadline is reset after reading the headers and the Handler can decide what is considered too slow for the body. If ReadHeaderTimeout is zero, the value of ReadTimeout is used. If both are zero, there is no timeout.
          read_timeout:
            type: duration
            doc: ReadTimeout is the maximum duration for reading the entire request, including the body. A zero or negative value means there will be no timeout. Because ReadTimeout does not let Handlers make per-request decisions on each request body's acceptable deadline or upload rate, most users will prefer to use ReadHeaderTimeout. It is valid to use them both.
          response_headers:
            children:
              item:
                type: map
                children:
                  name:
                    type: string
                  value:
                    type: string
                    doc: String alias that is marshaled and printed in an opaque way. To recover the original value, cast it to a string.
                doc: Pair is an element of a MapList, and consists of a name and an opaque value.
            doc: Additional headers attached to each HTTP response sent to the client. Header values are opaque since they may be sensitive.
          tls:
            type: map
            children:
              ca_file:
                type: string
                doc: Path to the CA cert. For a client this verifies the server certificate. For a server this verifies client certificates. If empty uses system root CA. (optional)
              ca_pem:
                type: string
                doc: In memory PEM encoded cert. (optional)
              cert_file:
                type: string
                doc: Path to the TLS cert to use for TLS required connections. (optional)
              cert_pem:
                type: string
                doc: In memory PEM encoded TLS cert to use for TLS required connections. (optional)
              cipher_suites:
                type: list
                children:
                  item:
                    type: string
                doc: CipherSuites is a list of TLS cipher suites that the TLS transport can use. If left blank, a safe default list is used. See https://go.dev/src/crypto/tls/cipher_suites.go for a list of supported cipher suites.
              client_ca_file:
                type: string
                doc: Path to the TLS cert to use by the server to verify a client certificate. (optional) This sets the ClientCAs and ClientAuth to RequireAndVerifyClientCert in the TLSConfig. Please refer to https://godoc.org/crypto/tls#Config for more information. (optional)
              client_ca_file_reload:
                type: bool
                doc: Reload the ClientCAs file when it is modified (optional, default false)
              curve_preferences:
                type: list
                children:
                  item:
                    type: string
                doc: contains the elliptic curves that will be used in an ECDHE handshake, in preference order Defaults to empty list and "crypto/tls" defaults are used, internally.
              include_insecure_cipher_suites:
                type: bool
              include_system_ca_certs_pool:
                type: bool
                doc: If true, load system CA certificates pool in addition to the certificates configured in this struct.
              key_file:
                type: string
                doc: Path to the TLS key to use for TLS required connections. (optional)
              key_pem:
                type: string
                doc: In memory PEM encoded TLS key to use for TLS required connections. (optional)
              max_version:
                type: string
                doc: MaxVersion sets the maximum TLS version that is acceptable. If not set, refer to crypto/tls for defaults. (optional)
              min_version:
                type: string
                doc: MinVersion sets the minimum TLS version that is acceptable. If not set, TLS 1.2 will be used. (optional)
              reload_interval:
                type: duration
                doc: ReloadInterval specifies the duration after which the certificate will be reloaded If not set, it will never be reloaded (optional)
              tpm:
                type: map
                children:
                  auth:
                    type: string
                  enabled:
                    type: bool
                  owner_auth:
                    type: string
                  path:
                    type: string
                    doc: The path to the TPM device or Unix domain socket. For instance /dev/tpm0 or /dev/tpmrm0.
                doc: Trusted platform module configuration
            doc: TLS struct exposes TLS client configuration.
          transport:
            type: string
          write_timeout:
            type: duration
            doc: WriteTimeout is the maximum duration before timing out writes of the response. It is reset whenever a new request's header is read. Like ReadTimeout, it does not let Handlers make decisions on a per-request basis. A zero or negative value means there will be no timeout.
        doc: ServerConfig defines settings for creating an HTTP server.
    resource:
      type: resource
      signals:
        - traces
        - metrics
        - logs
        - profiles
      stability:
        logs: beta
        metrics: beta
        profiles: development
        traces: beta
      module: github.com/open-telemetry/opentelemetry-collector-contrib/processor/resourceprocessor
      fields:
        type: map
        children:
          attributes:
            type: list
            children:
              item:
                type: map
                children:
                  action:
                    type: string
                    doc: Action specifies the type of action to perform. The set of values are {INSERT, UPDATE, UPSERT, DELETE, HASH}. Both lower case and upper case are supported. INSERT -  Inserts the key/value to attributes when the key does not exist. No action is applied to attributes where the key already exists. Either Value, FromAttribute or FromContext must be set. UPDATE -  Updates an existing key with a value. No action is applied to attributes where the key does not exist. Either Value, FromAttribute or FromContext must be set. UPSERT -  Performs insert or update action depending on the attributes containing the key. The key/value is inserted to attributes that did not originally have the key. The key/value is updated for attributes where the key already existed. Either Value, FromAttribute or FromContext must be set. DELETE  - Deletes the attribute. If the key doesn't exist, no action is performed. HASH    - Calculates the SHA-1 hash of an existing value and overwrites the value with its SHA-1 hash result. If the feature gate `coreinternal.attraction.hash.sha256` is enabled, it uses SHA2-256 instead. EXTRACT - Extracts values using a regular expression rule from the input 'key' to target keys specified in the 'rule'. If a target key already exists, it will be overridden. CONVERT  - converts the type of an existing attribute, if convertable This is a required field.
                  converted_type:
                    type: string
                    doc: ConvertedType specifies the target type of an attribute to be converted If the key doesn't exist, no action is performed. If the value cannot be converted, the original value will be left as-is
                  default_value:
                    type: map
                    open: true
                    doc: DefaultValue specifies the value to use if Value/FromAttribute/FromContext doesn't provide a value (e.g., environment variable not set, attribute doesn't exist). Only used with INSERT, UPDATE, and UPSERT actions.
                  from_attribute:
                    type: string
                    doc: FromAttribute specifies the attribute to use to populate the value. If the attribute doesn't exist, no action is performed.
                  from_context:
                    type: string
                    doc: FromContext specifies the context value to use to populate the value. The values would be searched in client.Info.Metadata. If the key doesn't exist, no action is performed. If the key has multiple values the values will be joined with `;` separator.
                  key:
                    type: string
                    doc: Key specifies the attribute to act upon. This is a required field.
                  pattern:
                    type: string
                    doc: 'A regex pattern must be specified for the action EXTRACT. It uses the attribute specified by `key'' to extract values from The target keys are inferred based on the names of the matcher groups provided and the names will be inferred based on the values of the matcher group. Note: All subexpressions must have a name. Note: The value type of the source key must be a string. If it isn''t, no extraction will occur.'
                  value:
                    type: map
                    open: true
                    doc: Value specifies the value to populate for the key. The type of the value is inferred from the configuration.
                doc: ActionKeyValue specifies the attribute key to act upon.
            doc: AttributesActions specifies the list of actions to be applied on resource attributes. The set of actions are {INSERT, UPDATE, UPSERT, DELETE, HASH, EXTRACT}.
        doc: Config defines configuration for Resource processor.
