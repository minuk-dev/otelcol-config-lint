    k8s_events:
      type: k8s_events
      signals:
        - logs
      stability:
        logs: alpha
      module: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/k8seventsreceiver
      fields:
        type: map
        children:
          auth_type:
            type: string
            doc: How to authenticate to the K8s API server.  This can be one of `none` (for no auth), `serviceAccount` (to use the standard service account token provided to the agent pod), or `kubeConfig` to use credentials from `~/.kube/config`.
          context:
            type: string
            doc: When using auth_type `kubeConfig`, override the current context.
          dedup_interval:
            type: duration
            doc: 'DedupInterval controls throttling of MODIFIED watch events per event UID. positive: emit MODIFIED only after interval has elapsed since the last emit for that UID 0 (default): no throttling — current behavior, backward compatible negative: drop all MODIFIED events'
          k8s_leader_elector:
            type: map
            open: true
          kube_api_burst:
            type: int
            doc: KubeAPIBurst is the maximum burst of requests to the Kubernetes API. Uses client-go's default (10) if unset. Increase if you see client-side throttling warnings.
          kube_api_qps:
            type: float
            doc: KubeAPIQPS is the maximum number of queries per second to the Kubernetes API. Uses client-go's default (5) if unset. Increase if you see client-side throttling warnings.
          namespaces:
            type: list
            children:
              item:
                type: string
            doc: List of ‘namespaces’ to collect events from.
          storage:
            type: map
            open: true
            doc: Storage is the ID of the storage extension to use for resource version persistence. When set, the receiver will persist the latest resource version and resume from it on restart, preventing duplicate events. Only valid for watch mode (which is the only mode this receiver uses).
        doc: Config defines configuration for kubernetes events receiver.
