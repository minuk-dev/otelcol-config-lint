            type: map
            children:
              enabled:
                type: bool
                doc: Enabled indicates whether to not retry sending logs in case of receiving a retryable error from a downstream consumer. Default is false.
              initial_interval:
                type: duration
                doc: InitialInterval the time to wait after the first failure before retrying. Default value is 1 second.
              max_elapsed_time:
                type: duration
                doc: MaxElapsedTime is the maximum amount of time (including retries) spent trying to send a logs batch to a downstream consumer. Once this value is reached, the data is discarded. It never stops if MaxElapsedTime == 0. Default value is 5 minutes.
              max_interval:
                type: duration
                doc: MaxInterval is the upper bound on backoff interval. Once this value is reached the delay between consecutive retries will always be `MaxInterval`. Default value is 30 seconds.
