                    type: string
                    doc: String alias that is marshaled and printed in an opaque way. To recover the original value, cast it to a string.
                doc: Pair is an element of a MapList, and consists of a name and an opaque value.
            doc: Additional headers attached to each HTTP request sent by the client. Existing header values are overwritten if collision happens. Header values are opaque since they may be sensitive.
          http2_ping_timeout:
            type: duration
            doc: HTTP2PingTimeout if there's no response to the ping within the configured value, the connection will be closed. If not set or set to 0, it defaults to 15s.
          http2_read_idle_timeout:
            type: duration
            doc: This is needed in case you run into https://github.com/golang/go/issues/59690 https://github.com/golang/go/issues/36026 HTTP2ReadIdleTimeout if the connection has been idle for the configured value send a ping frame for health check 0s means no health check will be performed.
          idle_conn_timeout:
            type: duration
            doc: IdleConnTimeout is the maximum amount of time a connection will remain open before closing itself. By default, it is set to 90 seconds.
          logs_endpoint:
            type: string
            doc: The URL to send logs to. If omitted the Endpoint + "/v1/logs" will be used.
          max_conns_per_host:
            type: int
            doc: MaxConnsPerHost limits the total number of connections per host, including connections in the dialing, active, and idle states. Default is 0 (unlimited).
          max_idle_conns:
            type: int
            doc: MaxIdleConns is used to set a limit to the maximum idle HTTP connections the client can keep open. By default, it is set to 100. Zero means no limit.
          max_idle_conns_per_host:
            type: int
            doc: MaxIdleConnsPerHost is used to set a limit to the maximum idle HTTP connections the host can keep open. If zero, [net/http.DefaultMaxIdleConnsPerHost] is used.
          metrics_endpoint:
            type: string
            doc: The URL to send metrics to. If omitted the Endpoint + "/v1/metrics" will be used.
          middlewares:
            type: list
            children:
              item:
                type: map
                children:
                  id:
                    type: map
                    open: true
                    doc: ID specifies the name of the extension to use.
                doc: Middleware defines the extension ID for a middleware component.
            doc: Middlewares are used to add custom functionality to the HTTP client. Middleware handlers are called in the order they appear in this list, with the first middleware becoming the outermost handler.
          profiles_endpoint:
            type: string
            doc: The URL to send profiles to. If omitted the Endpoint + "/v1development/profiles" will be used.
          proxy_url:
            type: string
            doc: ProxyURL setting for the collector
          read_buffer_size:
            type: int
            doc: ReadBufferSize for HTTP client. See http.Transport.ReadBufferSize. Default is 0.
          retry_on_failure:
            type: map
            children:
              enabled:
                type: bool
                doc: Enabled indicates whether to not retry sending batches in case of export failure.
              initial_interval:
                type: duration
                doc: InitialInterval the time to wait after the first failure before retrying.
              max_elapsed_time:
                type: duration
                doc: MaxElapsedTime is the maximum amount of time (including retries) spent trying to send a request/batch. Once this value is reached, the data is discarded. If set to 0, the retries are never stopped.
              max_interval:
                type: duration
                doc: MaxInterval is the upper bound on backoff interval. Once this value is reached the delay between consecutive retries will always be `MaxInterval`.
              multiplier:
                type: float
                doc: Multiplier is the value multiplied by the backoff interval bounds
              randomization_factor:
                type: float
                doc: RandomizationFactor is a random factor used to calculate next backoffs Randomized interval = RetryInterval * (1 ± RandomizationFactor)
            doc: BackOffConfig defines configuration for retrying batches in case of export failure. The current supported strategy is exponential backoff.
          sending_queue:
            type: map
            children:
              batch:
                type: map
                children:
                  flush_timeout:
                    type: duration
                    doc: FlushTimeout sets the time after which a batch will be sent regardless of its size.
                  max_size:
                    type: int
                    doc: MaxSize defines the configuration for the maximum size of a batch.
                  min_size:
                    type: int
                    doc: MinSize defines the configuration for the minimum size of a batch.
                  partition:
                    type: map
                    children:
                      metadata_keys:
                        type: list
                        children:
                          item:
                            type: string
                        doc: MetadataKeys is a list of client.Metadata keys that will be used to partition the data into batches. If this setting is empty, a single batcher instance will be used. When this setting is not empty, one batcher will be used per distinct combination of values for the listed metadata keys. Empty value and unset metadata are treated as distinct cases. Entries are case-insensitive. Duplicated entries will trigger a validation error.
                    doc: Partition defines the partitioning of the batches configuration.
                  sizer:
                    type: map
                    open: true
                    doc: Sizer determines the type of size measurement used by the batch. If not configured, use the same configuration as the queue. It accepts "requests", "items", or "bytes".
                doc: BatchConfig it configures how the requests are consumed from the queue and batch together during consumption.
              block_on_overflow:
                type: bool
                doc: BlockOnOverflow determines the behavior when the component's TotalSize limit is reached. If true, the component will wait for space; otherwise, operations will immediately return a retryable error.
              enabled:
                type: bool
                doc: Enabled indicates whether to not enqueue and batch before exporting.
              num_consumers:
                type: int
                doc: NumConsumers is the maximum number of concurrent consumers from the queue. This applies across all different optional configurations from above (e.g. wait_for_result, block_on_overflow, storage, etc.).
              queue_size:
                type: int
                doc: QueueSize represents the maximum data size allowed for concurrent storage and processing.
              sizer:
                type: map
                open: true
                doc: Sizer determines the type of size measurement used by this component. It accepts "requests", "items", or "bytes".
              storage:
                type: map
                open: true
                doc: 'StorageID if not empty, enables the persistent storage and uses the component specified as a storage extension for the persistent queue. TODO: This will be changed to Optional when available. See https://github.com/open-telemetry/opentelemetry-collector/issues/13822'
              wait_for_result:
                type: bool
                doc: WaitForResult determines if incoming requests are blocked until the request is processed or not. Currently, this option is not available when persistent queue is configured using the storage configuration.
            doc: QueueBatchConfig defines configuration for queueing and batching for the exporter.
          timeout:
            type: duration
            doc: Timeout parameter configures `http.Client.Timeout`. Default is 0 (unlimited).
          tls:
            type: map
            children:
              ca_file:
                type: string
                doc: Path to the CA cert. For a client this verifies the server certificate. For a server this verifies client certificates. If empty uses system root CA. (optional)
              ca_pem:
                type: string
                doc: In memory PEM encoded cert. (optional)
              cert_file:
                type: string
                doc: Path to the TLS cert to use for TLS required connections. (optional)
              cert_pem:
                type: string
                doc: In memory PEM encoded TLS cert to use for TLS required connections. (optional)
              cipher_suites:
                type: list
                children:
                  item:
                    type: string
                doc: CipherSuites is a list of TLS cipher suites that the TLS transport can use. If left blank, a safe default list is used. See https://go.dev/src/crypto/tls/cipher_suites.go for a list of supported cipher suites.
              curve_preferences:
                type: list
                children:
                  item:
                    type: string
                doc: contains the elliptic curves that will be used in an ECDHE handshake, in preference order Defaults to empty list and "crypto/tls" defaults are used, internally.
              include_insecure_cipher_suites:
                type: bool
              include_system_ca_certs_pool:
                type: bool
                doc: If true, load system CA certificates pool in addition to the certificates configured in this struct.
              insecure:
                type: bool
                doc: In gRPC and HTTP when set to true, this is used to disable the client transport security. See https://godoc.org/google.golang.org/grpc#WithInsecure for gRPC. Please refer to https://godoc.org/crypto/tls#Config for more information. (optional, default false)
              insecure_skip_verify:
                type: bool
                doc: InsecureSkipVerify will enable TLS but not verify the certificate.
              key_file:
                type: string
                doc: Path to the TLS key to use for TLS required connections. (optional)
              key_pem:
                type: string
                doc: In memory PEM encoded TLS key to use for TLS required connections. (optional)
              max_version:
                type: string
                doc: MaxVersion sets the maximum TLS version that is acceptable. If not set, refer to crypto/tls for defaults. (optional)
              min_version:
                type: string
                doc: MinVersion sets the minimum TLS version that is acceptable. If not set, TLS 1.2 will be used. (optional)
              reload_interval:
                type: duration
                doc: ReloadInterval specifies the duration after which the certificate will be reloaded If not set, it will never be reloaded (optional)
              server_name_override:
                type: string
                doc: ServerName requested by client for virtual hosting. This sets the ServerName in the TLSConfig. Please refer to https://godoc.org/crypto/tls#Config for more information. (optional)
              tpm:
                type: map
                children:
                  auth:
                    type: string
                  enabled:
                    type: bool
                  owner_auth:
                    type: string
                  path:
                    type: string
                    doc: The path to the TPM device or Unix domain socket. For instance /dev/tpm0 or /dev/tpmrm0.
                doc: Trusted platform module configuration
            doc: TLS struct exposes TLS client configuration.
          traces_endpoint:
            type: string
            doc: The URL to send traces to. If omitted the Endpoint + "/v1/traces" will be used.
          write_buffer_size:
            type: int
            doc: WriteBufferSize for HTTP client. See http.Transport.WriteBufferSize. Default is 0.
        doc: Config defines configuration for OTLP/HTTP exporter.
  receiver:
    otlp:
      type: otlp
      signals:
        - traces
        - metrics
        - logs
        - profiles
      stability:
        logs: stable
        metrics: stable
        profiles: alpha
        traces: stable
      module: go.opentelemetry.io/collector/receiver/otlpreceiver
      fields:
        type: map
        children:
          protocols:
            type: map
            children:
              grpc:
                type: map
                children:
                  auth:
                    type: map
                    children:
                      authenticator:
                        type: string
                        doc: id of an authenticator extension
                  endpoint:
                    type: string
                    doc: host:port to listen on, e.g. 0.0.0.0:4317
                  include_metadata:
                    type: bool
                  keepalive:
                    type: map
                    children:
                      enforcement_policy:
                        type: map
                        children:
                          min_time:
                            type: duration
                          permit_without_stream:
                            type: bool
                      server_parameters:
                        type: map
                        children:
                          max_connection_age:
                            type: duration
                          max_connection_age_grace:
                            type: duration
                          max_connection_idle:
                            type: duration
                          time:
                            type: duration
                          timeout:
                            type: duration
                  max_concurrent_streams:
                    type: int
                  max_recv_msg_size_mib:
                    type: int
                  read_buffer_size:
                    type: int
                  tls:
                    type: map
                    children:
                      ca_file:
                        type: string
                      ca_pem:
                        type: string
                      cert_file:
                        type: string
                      cert_pem:
                        type: string
                      cipher_suites:
                        type: list
                        children:
                          item:
                            type: string
                      client_ca_file:
                        type: string
                      client_ca_file_reload:
                        type: bool
                      include_system_ca_certs_pool:
                        type: bool
                      key_file:
                        type: string
                      key_pem:
                        type: string
                      max_version:
                        type: string
                      min_version:
                        type: string
                      reload_interval:
                        type: duration
                  transport:
                    type: string
                    enum:
                      - tcp
                      - tcp4
                      - tcp6
                      - udp
                      - udp4
                      - udp6
                      - ip
                      - ip4
                      - ip6
                      - unix
                      - unixgram
                      - unixpacket
                  write_buffer_size:
                    type: int
              http:
                type: map
                children:
                  auth:
                    type: map
                    children:
                      authenticator:
                        type: string
                  compression_algorithms:
                    type: list
                    children:
                      item:
                        type: string
                  cors:
                    type: map
                    children:
                      allowed_headers:
                        type: list
                        children:
                          item:
                            type: string
                      allowed_origins:
                        type: list
                        children:
                          item:
                            type: string
                      max_age:
                        type: int
                  endpoint:
                    type: string
                    doc: host:port to listen on, e.g. 0.0.0.0:4318
                  include_metadata:
                    type: bool
                  logs_url_path:
                    type: string
                  max_request_body_size:
                    type: int
                  metrics_url_path:
                    type: string
                  response_headers:
                    type: map
                    open: true
                  tls:
                    type: map
                    children:
                      ca_file:
                        type: string
                      ca_pem:
                        type: string
                      cert_file:
                        type: string
                      cert_pem:
                        type: string
                      cipher_suites:
                        type: list
                        children:
                          item:
                            type: string
                      client_ca_file:
                        type: string
                      client_ca_file_reload:
                        type: bool
                      include_system_ca_certs_pool:
                        type: bool
                      key_file:
                        type: string
                      key_pem:
                        type: string
                      max_version:
                        type: string
                      min_version:
                        type: string
                      reload_interval:
                        type: duration
                  traces_url_path:
                    type: string
            doc: at least one of grpc or http must be enabled
        required:
          - protocols
