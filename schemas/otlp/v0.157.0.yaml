                doc: NumConsumers is the maximum number of concurrent consumers from the queue. This applies across all different optional configurations from above (e.g. wait_for_result, block_on_overflow, storage, etc.).
              queue_size:
                type: int
                doc: QueueSize represents the maximum data size allowed for concurrent storage and processing.
              sizer:
                type: map
                open: true
                doc: Sizer determines the type of size measurement used by this component. It accepts "requests", "items", or "bytes".
