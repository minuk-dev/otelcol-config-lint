                    doc: Partition defines the partitioning of the batches configuration.
                  sizer:
                    type: map
                    open: true
                    doc: Sizer determines the type of size measurement used by the batch. If not configured, use the same configuration as the queue. It accepts "requests", "items", or "bytes".
                doc: BatchConfig it configures how the requests are consumed from the queue and batch together during consumption.
              block_on_overflow:
                type: bool
                doc: BlockOnOverflow determines the behavior when the component's TotalSize limit is reached. If true, the component will wait for space; otherwise, operations will immediately return a retryable error.
              enabled:
                type: bool
                doc: Enabled indicates whether to not enqueue and batch before exporting.
              num_consumers:
