              randomization_factor:
                type: float
                doc: RandomizationFactor is a random factor used to calculate next backoffs Randomized interval = RetryInterval * (1 ± RandomizationFactor)
            doc: BackOffConfig defines configuration for retrying batches in case of export failure. The current supported strategy is exponential backoff.
          sending_queue:
            type: map
            children:
              batch:
                type: map
                children:
                  flush_timeout:
                    type: duration
                    doc: FlushTimeout sets the time after which a batch will be sent regardless of its size.
                  max_size:
                    type: int
                    doc: MaxSize defines the configuration for the maximum size of a batch.
