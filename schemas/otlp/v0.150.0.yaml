          auth:
            type: map
            children:
              authenticator:
                type: string
          authority:
            type: string
          balancer_name:
            type: string
            enum:
              - round_robin
              - pick_first
          compression:
            type: string
            enum:
              - gzip
              - snappy
              - zstd
              - zlib
              - deflate
              - lz4
              - none
              - ""
          endpoint:
            type: string
            doc: host:port of the OTLP gRPC endpoint
          headers:
            type: map
            open: true
            doc: extra gRPC metadata sent with every request
          keepalive:
            type: map
            children:
              permit_without_stream:
                type: bool
              time:
                type: duration
              timeout:
                type: duration
          read_buffer_size:
            type: int
          retry_on_failure:
            type: map
            children:
              enabled:
                type: bool
              initial_interval:
                type: duration
              max_elapsed_time:
                type: duration
              max_interval:
                type: duration
              multiplier:
                type: float
              randomization_factor:
                type: float
          sending_queue:
            type: map
            children:
              blocking:
                type: bool
              enabled:
                type: bool
              num_consumers:
                type: int
              queue_size:
                type: int
              sizer:
                type: string
                enum:
                  - requests
                  - items
                  - bytes
              storage:
                type: string
                doc: id of a storage extension for a persistent queue
              wait_for_result:
                type: bool
            open: true
          timeout:
            type: duration
          tls:
            type: map
            children:
              ca_file:
                type: string
              ca_pem:
                type: string
              cert_file:
                type: string
              cert_pem:
                type: string
              cipher_suites:
                type: list
                children:
                  item:
                    type: string
              include_system_ca_certs_pool:
                type: bool
              insecure:
                type: bool
                doc: send in plaintext; only for local testing
              insecure_skip_verify:
                type: bool
                doc: accept any server certificate
              key_file:
                type: string
              key_pem:
                type: string
              max_version:
                type: string
              min_version:
                type: string
              reload_interval:
                type: duration
              server_name_override:
                type: string
          wait_for_ready:
            type: bool
          write_buffer_size:
            type: int
        required:
          - endpoint
