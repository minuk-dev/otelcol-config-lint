  receiver:
    host_metrics:
      type: host_metrics
      signals:
        - metrics
        - logs
      stability:
        logs: development
        metrics: beta
      distributions:
        - core
        - contrib
        - k8s
      module: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/hostmetricsreceiver
      alias: hostmetrics
      fields:
        type: map
        children:
          collection_interval:
            type: duration
            doc: CollectionInterval sets how frequently the scraper should be called and used as the context timeout to ensure that scrapers don't exceed the interval.
          initial_delay:
            type: duration
            doc: InitialDelay sets the initial start delay for the scraper, any non positive value is assumed to be immediately.
          metadata_collection_interval:
            type: duration
            doc: Collection interval for metadata. Metadata of the particular entity is collected when the entity changes. In addition metadata of all entities is collected periodically even if no changes happen. Setting the duration to 0 will disable periodic collection (however will not impact metadata collection on changes).
          root_path:
            type: string
            doc: RootPath is the host's root directory (linux only).
          scrapers:
            type: map
            children:
              cpu: {}
              disk: {}
              filesystem: {}
              load: {}
              memory: {}
              network: {}
              nfs: {}
              paging: {}
              process: {}
              processes: {}
              system: {}
            doc: Map of scrapers to be run, keyed by scraper type.
          timeout:
            type: duration
            doc: Timeout is an optional value used to set scraper's context deadline.
        doc: Config defines configuration for HostMetrics receiver.
    hostmetrics:
      type: hostmetrics
      signals:
        - metrics
        - logs
      stability:
        logs: development
        metrics: beta
      distributions:
        - core
        - contrib
        - k8s
      module: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/hostmetricsreceiver
      deprecated: renamed to "host_metrics" upstream; the old name still resolves for now
      aliasOf: host_metrics
      fields:
        type: map
        children:
          collection_interval:
            type: duration
            doc: CollectionInterval sets how frequently the scraper should be called and used as the context timeout to ensure that scrapers don't exceed the interval.
          initial_delay:
            type: duration
            doc: InitialDelay sets the initial start delay for the scraper, any non positive value is assumed to be immediately.
          metadata_collection_interval:
            type: duration
