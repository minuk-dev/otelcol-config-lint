                    type: string
                  max_request_body_size:
                    type: int
                  metrics_url_path:
                    type: string
                  response_headers:
                    type: map
                    open: true
                  tls:
                    type: map
                    children:
                      ca_file:
                        type: string
                      ca_pem:
                        type: string
                      cert_file:
                        type: string
                      cert_pem:
                        type: string
                      cipher_suites:
                        type: list
                        children:
                          item:
                            type: string
                      client_ca_file:
                        type: string
                      client_ca_file_reload:
                        type: bool
                      include_system_ca_certs_pool:
                        type: bool
                      key_file:
                        type: string
                      key_pem:
                        type: string
                      max_version:
                        type: string
                      min_version:
                        type: string
                      reload_interval:
