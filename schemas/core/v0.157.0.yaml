    memory_limiter:
      type: memory_limiter
      signals:
        - traces
        - metrics
        - logs
        - profiles
      stability:
        logs: beta
        metrics: beta
        profiles: alpha
        traces: beta
      distributions:
        - core
        - contrib
        - k8s
      module: go.opentelemetry.io/collector/processor/memorylimiterprocessor
      fields:
        type: map
        children:
          check_interval:
            type: duration
            doc: how often memory use is measured; 1s is the usual value
          limit_mib:
            type: int
            doc: hard limit in MiB; above it the processor starts refusing data
          limit_percentage:
            type: int
            doc: hard limit as a percentage of total memory, for containers
          spike_limit_mib:
            type: int
            doc: headroom in MiB reserved for allocation spikes
          spike_limit_percentage:
            type: int
            doc: spike headroom as a percentage of total memory
        required:
          - check_interval
    probabilistic_sampler:
      type: probabilistic_sampler
      signals:
        - traces
        - logs
      stability:
        logs: alpha
        traces: beta
      distributions:
        - core
        - contrib
        - k8s
      module: github.com/open-telemetry/opentelemetry-collector-contrib/processor/probabilisticsamplerprocessor
      fields:
        type: map
        children:
          attribute_source:
            type: string
          fail_closed:
            type: bool
            doc: FailClosed indicates to not sample data (the processor will fail "closed") in case of error, such as failure to parse the tracestate field or missing the randomness attribute. By default, failure cases are sampled (the processor is fails "open").  Sampling priority-based decisions are made after FailClosed is processed, making it possible to sample despite errors using priority.
          from_attribute:
            type: string
            doc: FromAttribute (logs only) The optional name of a log record attribute used for sampling purposes, such as a unique log record ID. The value of the attribute is only used if the trace ID is absent or if `attribute_source` is set to `record`.
          hash_seed:
            type: int
            doc: 'HashSeed allows one to configure the hashing seed. This is important in scenarios where multiple layers of collectors have different sampling rates: if they use the same seed all passing one layer may pass the other even if they have different sampling rates, configuring different seeds avoids that.'
          mode:
            type: string
            doc: 'Mode selects the sampling behavior. Supported values: - "hash_seed": the legacy behavior of this processor. Using an FNV hash combined with the HashSeed value, this sampler performs a non-consistent probabilistic downsampling.  The number of spans output is expected to equal SamplingPercentage (as a ratio) times the number of spans inpout, assuming good behavior from FNV and good entropy in the hashed attributes or TraceID. - "equalizing": Using an OTel-specified consistent sampling mechanism, this sampler selectively reduces the effective sampling probability of arriving spans.  This can be useful to select a small fraction of complete traces from a stream with mixed sampling rates.  The rate of spans passing through depends on how much sampling has already been applied.  If an arriving span was head sampled at the same probability it passes through.  If the span arrives with lower probability, a warning is logged because it means this sampler is configured with too large a sampling probability to ensure complete traces. - "proportional": Using an OTel-specified consistent sampling mechanism, this sampler reduces the effective sampling probability of each span by `SamplingProbability`.'
          sampling_percentage:
            type: float
            doc: 'SamplingPercentage is the percentage rate at which traces or logs are going to be sampled. Defaults to zero, i.e.: no sample. Values greater or equal 100 are treated as "sample all traces/logs".'
          sampling_precision:
            type: int
            doc: SamplingPrecision is how many hex digits of sampling threshold will be encoded, from 1 up to 14.  Default is 4. 0 is treated as full precision.
          sampling_priority:
            type: string
            doc: SamplingPriority (logs only) enables using a log record attribute as the sampling priority of the log record.
        doc: Config has the configuration guiding the sampler processor.
    resource:
      type: resource
      signals:
        - traces
        - metrics
        - logs
        - profiles
      stability:
        logs: beta
        metrics: beta
        profiles: development
        traces: beta
      distributions:
        - core
        - contrib
        - k8s
      module: github.com/open-telemetry/opentelemetry-collector-contrib/processor/resourceprocessor
      fields:
        type: map
        children:
          attributes:
            type: list
            children:
              item:
                type: map
                children:
                  action:
                    type: string
                    doc: Action specifies the type of action to perform. The set of values are {INSERT, UPDATE, UPSERT, DELETE, HASH}. Both lower case and upper case are supported. INSERT -  Inserts the key/value to attributes when the key does not exist. No action is applied to attributes where the key already exists. Either Value, FromAttribute or FromContext must be set. UPDATE -  Updates an existing key with a value. No action is applied to attributes where the key does not exist. Either Value, FromAttribute or FromContext must be set. UPSERT -  Performs insert or update action depending on the attributes containing the key. The key/value is inserted to attributes that did not originally have the key. The key/value is updated for attributes where the key already existed. Either Value, FromAttribute or FromContext must be set. DELETE  - Deletes the attribute. If the key doesn't exist, no action is performed. HASH    - Calculates the SHA-1 hash of an existing value and overwrites the value with its SHA-1 hash result. If the feature gate `coreinternal.attraction.hash.sha256` is enabled, it uses SHA2-256 instead. EXTRACT - Extracts values using a regular expression rule from the input 'key' to target keys specified in the 'rule'. If a target key already exists, it will be overridden. CONVERT  - converts the type of an existing attribute, if convertable This is a required field.
                  converted_type:
                    type: string
                    doc: ConvertedType specifies the target type of an attribute to be converted If the key doesn't exist, no action is performed. If the value cannot be converted, the original value will be left as-is
                  default_value:
                    type: map
                    open: true
                    doc: DefaultValue specifies the value to use if Value/FromAttribute/FromContext doesn't provide a value (e.g., environment variable not set, attribute doesn't exist). Only used with INSERT, UPDATE, and UPSERT actions.
                  from_attribute:
                    type: string
                    doc: FromAttribute specifies the attribute to use to populate the value. If the attribute doesn't exist, no action is performed.
                  from_context:
                    type: string
                    doc: FromContext specifies the context value to use to populate the value. The values would be searched in client.Info.Metadata. If the key doesn't exist, no action is performed. If the key has multiple values the values will be joined with `;` separator.
                  key:
                    type: string
                    doc: Key specifies the attribute to act upon. This is a required field.
                  pattern:
                    type: string
                    doc: 'A regex pattern must be specified for the action EXTRACT. It uses the attribute specified by `key'' to extract values from The target keys are inferred based on the names of the matcher groups provided and the names will be inferred based on the values of the matcher group. Note: All subexpressions must have a name. Note: The value type of the source key must be a string. If it isn''t, no extraction will occur.'
                  value:
                    type: map
                    open: true
                    doc: Value specifies the value to populate for the key. The type of the value is inferred from the configuration.
                doc: ActionKeyValue specifies the attribute key to act upon.
            doc: AttributesActions specifies the list of actions to be applied on resource attributes. The set of actions are {INSERT, UPDATE, UPSERT, DELETE, HASH, EXTRACT}.
        doc: Config defines configuration for Resource processor.
