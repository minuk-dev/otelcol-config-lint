    memory_limiter:
      type: memory_limiter
      stability:
        extension: development
      distributions:
        - core
      module: go.opentelemetry.io/collector/extension/memorylimiterextension
      fields:
        type: map
        children:
          check_interval:
            type: duration
            doc: CheckInterval is the time between measurements of memory usage for the purposes of avoiding going over the limits. Defaults to zero, so no checks will be performed.
          limit_mib:
            type: int
            doc: MemoryLimitMiB is the maximum amount of memory, in MiB, targeted to be allocated by the process.
          limit_percentage:
            type: int
            doc: MemoryLimitPercentage is the maximum amount of memory, in %, targeted to be allocated by the process. The fixed memory settings MemoryLimitMiB has a higher precedence.
          max_gc_interval_when_hard_limited:
            type: duration
            doc: MaxGCIntervalWhenHardLimited caps the exponential backoff between forced GC calls in hard-limited mode. Same semantics as MaxGCIntervalWhenSoftLimited but applies to the hard-limit path. Set to 0 to disable the exponential backoff on this path.
          max_gc_interval_when_soft_limited:
            type: duration
            doc: MaxGCIntervalWhenSoftLimited caps the exponential backoff between forced GC calls in soft-limited mode. When a forced GC fails to reclaim memory (e.g., held by live references in exporter queues during a downstream outage), the interval doubles starting from min_gc_interval_when_soft_limited (or 95% of check_interval, whichever is larger) up to this cap. It resets to zero whenever a GC is effective or memory drops on its own. Set to 0 to disable the exponential backoff on this path; the interval will not grow beyond the configured min.
          min_gc_interval_when_hard_limited:
            type: duration
            doc: MinGCIntervalWhenHardLimited minimum interval between forced GC when in hard (=limit_mib) limited mode. Zero value means no minimum interval. GCs is a CPU-heavy operation and executing it too frequently may affect the recovery capabilities of the collector.
          min_gc_interval_when_soft_limited:
            type: duration
            doc: MinGCIntervalWhenSoftLimited minimum interval between forced GC when in soft (=limit_mib - spike_limit_mib) limited mode. Zero value means no minimum interval. GCs is a CPU-heavy operation and executing it too frequently may affect the recovery capabilities of the collector.
          spike_limit_mib:
            type: int
            doc: MemorySpikeLimitMiB is the maximum, in MiB, spike expected between the measurements of memory usage.
          spike_limit_percentage:
            type: int
            doc: MemorySpikePercentage is the maximum, in percents against the total memory, spike expected between the measurements of memory usage.
        doc: Config defines configuration for memory memoryLimiter processor.
    pprof:
      type: pprof
      stability:
        extension: beta
      distributions:
        - core
        - contrib
        - k8s
      module: github.com/open-telemetry/opentelemetry-collector-contrib/extension/pprofextension
      fields:
        type: map
        children:
          block_profile_fraction:
            type: int
            doc: Fraction of blocking events that are profiled. A value <= 0 disables profiling. See https://golang.org/pkg/runtime/#SetBlockProfileRate for details.
          dialer:
            type: map
            children:
              timeout:
                type: duration
                doc: Timeout is the maximum amount of time a dial will wait for a connect to complete. The default is no timeout.
            doc: DialerConfig contains options for connecting to an address.
          endpoint:
            type: string
            doc: Endpoint configures the address for this network connection. The address has the form "host:port". The host must be a literal IP address, or a host name that can be resolved to IP addresses. The port must be a literal port number or a service name. If the host is a literal IPv6 address it must be enclosed in square brackets, as in "[2001:db8::1]:80" or "[fe80::1%zone]:80". The zone specifies the scope of the literal IPv6 address as defined in RFC 4007.
          mutex_profile_fraction:
            type: int
            doc: Fraction of mutex contention events that are profiled. A value <= 0 disables profiling. See https://golang.org/pkg/runtime/#SetMutexProfileFraction for details.
          save_to_file:
            type: string
            doc: Optional file name to save the CPU profile to. The profiling starts when the Collector starts and is saved to the file when the Collector is terminated.
        doc: Config has the configuration for the extension enabling the golang net/http/pprof (Performance Profiler) extension.
    zpages:
      type: zpages
      stability:
        extension: beta
      distributions:
        - core
        - contrib
        - k8s
      module: go.opentelemetry.io/collector/extension/zpagesextension
      fields:
        type: map
        children:
          auth:
            type: map
            children:
              authenticator:
                type: map
                open: true
                doc: AuthenticatorID specifies the name of the extension to use in order to authenticate the incoming data point.
              request_params:
                type: list
                children:
                  item:
                    type: string
                doc: RequestParameters is a list of parameters that should be extracted from the request and added to the context. When a parameter is found in both the query string and the header, the value from the query string will be used.
            doc: Auth for this receiver
          compression_algorithms:
            type: list
            children:
              item:
                type: string
            doc: 'CompressionAlgorithms configures the list of compression algorithms the server can accept. Default: ["", "gzip", "zstd", "zlib", "snappy", "deflate"]'
          cors:
            type: map
            children:
              allowed_headers:
                type: list
                children:
                  item:
                    type: string
                doc: AllowedHeaders sets what headers will be allowed in CORS requests. The Accept, Accept-Language, Content-Type, and Content-Language headers are implicitly allowed. If no headers are listed, X-Requested-With will also be accepted by default. Include "*" to allow any request header.
              allowed_origins:
                type: list
                children:
                  item:
                    type: string
                doc: AllowedOrigins sets the allowed values of the Origin header for HTTP/JSON requests to an OTLP receiver. An origin may contain a wildcard (*) to replace 0 or more characters (e.g., "http://*.domain.com", or "*" to allow any origin).
              exposed_headers:
                type: list
                children:
                  item:
                    type: string
                doc: ExposedHeaders sets the value of the Access-Control-Expose-Headers response header, indicating which headers are safe to expose to the API of a CORS response.
              max_age:
                type: int
                doc: MaxAge sets the value of the Access-Control-Max-Age response header. Set it to the number of seconds that browsers should cache a CORS preflight response for.
            doc: CORS configures the server for HTTP cross-origin resource sharing (CORS).
          dialer:
            type: map
            children:
              timeout:
                type: duration
          endpoint:
            type: string
            doc: Endpoint configures the listening address for the server.
          expvar:
            type: map
            children:
              enabled:
                type: bool
                doc: Enabled indicates whether to enable expvar service. (default = false)
            doc: ExpvarConfig has the configuration for the expvar service.
          idle_timeout:
            type: duration
            doc: IdleTimeout is the maximum amount of time to wait for the next request when keep-alives are enabled. If IdleTimeout is zero, the value of ReadTimeout is used. If both are zero, there is no timeout.
          include_metadata:
            type: bool
            doc: IncludeMetadata propagates the client metadata from the incoming requests to the downstream consumers
          keep_alives_enabled:
            type: bool
            doc: KeepAlivesEnabled controls whether HTTP keep-alives are enabled. By default, keep-alives are always enabled. Only very resource-constrained environments should disable them.
          max_request_body_size:
            type: int
            doc: 'MaxRequestBodySize sets the maximum request body size in bytes. Default: 20MiB.'
          middlewares:
            type: list
            children:
              item:
                type: map
                children:
                  id:
                    type: map
                    open: true
                    doc: ID specifies the name of the extension to use.
                doc: Middleware defines the extension ID for a middleware component.
            doc: Middlewares are used to add custom functionality to the HTTP server. Middleware handlers are called in the order they appear in this list, with the first middleware becoming the outermost handler.
          read_header_timeout:
            type: duration
            doc: ReadHeaderTimeout is the amount of time allowed to read request headers. The connection's read deadline is reset after reading the headers and the Handler can decide what is considered too slow for the body. If ReadHeaderTimeout is zero, the value of ReadTimeout is used. If both are zero, there is no timeout.
          read_timeout:
            type: duration
            doc: ReadTimeout is the maximum duration for reading the entire request, including the body. A zero or negative value means there will be no timeout. Because ReadTimeout does not let Handlers make per-request decisions on each request body's acceptable deadline or upload rate, most users will prefer to use ReadHeaderTimeout. It is valid to use them both.
          response_headers:
            children:
              item:
                type: map
                children:
                  name:
                    type: string
                  value:
                    type: string
                    doc: String alias that is marshaled and printed in an opaque way. To recover the original value, cast it to a string.
                doc: Pair is an element of a MapList, and consists of a name and an opaque value.
            doc: Additional headers attached to each HTTP response sent to the client. Header values are opaque since they may be sensitive.
          tls:
            type: map
            children:
              ca_file:
                type: string
                doc: Path to the CA cert. For a client this verifies the server certificate. For a server this verifies client certificates. If empty uses system root CA. (optional)
              ca_pem:
                type: string
                doc: In memory PEM encoded cert. (optional)
              cert_file:
                type: string
                doc: Path to the TLS cert to use for TLS required connections. (optional)
              cert_pem:
                type: string
                doc: In memory PEM encoded TLS cert to use for TLS required connections. (optional)
              cipher_suites:
                type: list
                children:
                  item:
                    type: string
                doc: CipherSuites is a list of TLS cipher suites that the TLS transport can use. If left blank, a safe default list is used. See https://go.dev/src/crypto/tls/cipher_suites.go for a list of supported cipher suites.
              client_ca_file:
                type: string
                doc: Path to the TLS cert to use by the server to verify a client certificate. (optional) This sets the ClientCAs and ClientAuth to RequireAndVerifyClientCert in the TLSConfig. Please refer to https://godoc.org/crypto/tls#Config for more information. (optional)
              client_ca_file_reload:
                type: bool
                doc: Reload the ClientCAs file when it is modified (optional, default false)
              curve_preferences:
                type: list
                children:
                  item:
                    type: string
                doc: contains the elliptic curves that will be used in an ECDHE handshake, in preference order Defaults to empty list and "crypto/tls" defaults are used, internally.
              include_insecure_cipher_suites:
                type: bool
              include_system_ca_certs_pool:
                type: bool
                doc: If true, load system CA certificates pool in addition to the certificates configured in this struct.
              key_file:
                type: string
                doc: Path to the TLS key to use for TLS required connections. (optional)
              key_pem:
                type: string
                doc: In memory PEM encoded TLS key to use for TLS required connections. (optional)
              max_version:
                type: string
                doc: MaxVersion sets the maximum TLS version that is acceptable. If not set, refer to crypto/tls for defaults. (optional)
              min_version:
                type: string
                doc: MinVersion sets the minimum TLS version that is acceptable. If not set, TLS 1.2 will be used. (optional)
              reload_interval:
                type: duration
                doc: ReloadInterval specifies the duration after which the certificate will be reloaded If not set, it will never be reloaded (optional)
              tpm:
                type: map
                children:
                  auth:
                    type: string
                  enabled:
                    type: bool
                  owner_auth:
                    type: string
                  path:
                    type: string
                    doc: The path to the TPM device or Unix domain socket. For instance /dev/tpm0 or /dev/tpmrm0.
                doc: Trusted platform module configuration
            doc: TLS struct exposes TLS client configuration.
          transport:
            type: string
          write_timeout:
            type: duration
            doc: WriteTimeout is the maximum duration before timing out writes of the response. It is reset whenever a new request's header is read. Like ReadTimeout, it does not let Handlers make decisions on a per-request basis. A zero or negative value means there will be no timeout.
        doc: Config has the configuration for the extension enabling the zPages extension.
  processor:
    attributes:
      type: attributes
      signals:
        - traces
        - metrics
        - logs
      stability:
        logs: beta
        metrics: beta
        traces: beta
      distributions:
        - core
        - contrib
        - k8s
      module: github.com/open-telemetry/opentelemetry-collector-contrib/processor/attributesprocessor
      fields:
        type: map
        children:
          actions:
            type: list
            children:
              item:
                type: map
                children:
                  action:
                    type: string
                    doc: Action specifies the type of action to perform. The set of values are {INSERT, UPDATE, UPSERT, DELETE, HASH}. Both lower case and upper case are supported. INSERT -  Inserts the key/value to attributes when the key does not exist. No action is applied to attributes where the key already exists. Either Value, FromAttribute or FromContext must be set. UPDATE -  Updates an existing key with a value. No action is applied to attributes where the key does not exist. Either Value, FromAttribute or FromContext must be set. UPSERT -  Performs insert or update action depending on the attributes containing the key. The key/value is inserted to attributes that did not originally have the key. The key/value is updated for attributes where the key already existed. Either Value, FromAttribute or FromContext must be set. DELETE  - Deletes the attribute. If the key doesn't exist, no action is performed. HASH    - Calculates the SHA-1 hash of an existing value and overwrites the value with its SHA-1 hash result. If the feature gate `coreinternal.attraction.hash.sha256` is enabled, it uses SHA2-256 instead. EXTRACT - Extracts values using a regular expression rule from the input 'key' to target keys specified in the 'rule'. If a target key already exists, it will be overridden. CONVERT  - converts the type of an existing attribute, if convertable This is a required field.
                  converted_type:
                    type: string
                    doc: ConvertedType specifies the target type of an attribute to be converted If the key doesn't exist, no action is performed. If the value cannot be converted, the original value will be left as-is
                  default_value:
                    type: map
                    open: true
                    doc: DefaultValue specifies the value to use if Value/FromAttribute/FromContext doesn't provide a value (e.g., environment variable not set, attribute doesn't exist). Only used with INSERT, UPDATE, and UPSERT actions.
                  from_attribute:
                    type: string
                    doc: FromAttribute specifies the attribute to use to populate the value. If the attribute doesn't exist, no action is performed.
                  from_context:
                    type: string
                    doc: FromContext specifies the context value to use to populate the value. The values would be searched in client.Info.Metadata. If the key doesn't exist, no action is performed. If the key has multiple values the values will be joined with `;` separator.
                  key:
                    type: string
