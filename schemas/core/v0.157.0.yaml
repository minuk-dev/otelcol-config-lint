                      client_ca_file_reload:
                        type: bool
                      include_system_ca_certs_pool:
                        type: bool
                      key_file:
                        type: string
                      key_pem:
                        type: string
                      max_version:
                        type: string
                      min_version:
                        type: string
                      reload_interval:
                        type: duration
                  transport:
