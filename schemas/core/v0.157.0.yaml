        - traces
        - metrics
        - logs
        - profiles
      stability:
        logs: stable
        metrics: stable
        profiles: alpha
        traces: stable
      distributions:
        - core
        - contrib
        - k8s
        - otlp
      module: go.opentelemetry.io/collector/exporter/otlphttpexporter
      deprecated: renamed to "otlp_http" upstream; the old name still resolves for now
      aliasOf: otlp_http
      fields:
        type: map
        children:
          auth:
            type: map
            children:
              authenticator:
                type: map
                open: true
                doc: AuthenticatorID specifies the name of the extension to use in order to authenticate the incoming data point.
            doc: Auth configuration for outgoing HTTP calls.
          compression:
            type: string
            doc: The compression key for supported compression types within collector.
          compression_params:
            type: map
            children:
              level:
                type: int
            doc: Advanced configuration options for the Compression
          cookies:
            type: map
            open: true
            doc: Cookies configures the cookie management of the HTTP client.
          disable_keep_alives:
            type: bool
            doc: 'DisableKeepAlives, if true, disables HTTP keep-alives and will only use the connection to the server for a single HTTP request. WARNING: enabling this option can result in significant overhead establishing a new HTTP(S) connection for every request. Before enabling this option please consider whether changes to idle connection settings can achieve your goal.'
          encoding:
            type: string
            doc: 'The encoding to export telemetry (default: "proto")'
          endpoint:
            type: string
            doc: 'The target URL to send data to (e.g.: http://some.url:9411/v1/traces).'
          force_attempt_http2:
            type: bool
            doc: 'Enabling ForceAttemptHTTP2 forces the HTTP transport to use the HTTP/2 protocol. By default, this is set to true. NOTE: HTTP/2 does not support settings such as MaxConnsPerHost, MaxIdleConnsPerHost and MaxIdleConns.'
          headers:
            children:
              item:
                type: map
                children:
                  name:
                    type: string
                  value:
                    type: string
                    doc: String alias that is marshaled and printed in an opaque way. To recover the original value, cast it to a string.
                doc: Pair is an element of a MapList, and consists of a name and an opaque value.
            doc: Additional headers attached to each HTTP request sent by the client. Existing header values are overwritten if collision happens. Header values are opaque since they may be sensitive.
          http2_ping_timeout:
            type: duration
            doc: HTTP2PingTimeout if there's no response to the ping within the configured value, the connection will be closed. If not set or set to 0, it defaults to 15s.
          http2_read_idle_timeout:
            type: duration
            doc: This is needed in case you run into https://github.com/golang/go/issues/59690 https://github.com/golang/go/issues/36026 HTTP2ReadIdleTimeout if the connection has been idle for the configured value send a ping frame for health check 0s means no health check will be performed.
          idle_conn_timeout:
            type: duration
            doc: IdleConnTimeout is the maximum amount of time a connection will remain open before closing itself. By default, it is set to 90 seconds.
          logs_endpoint:
            type: string
            doc: The URL to send logs to. If omitted the Endpoint + "/v1/logs" will be used.
          max_conns_per_host:
            type: int
            doc: MaxConnsPerHost limits the total number of connections per host, including connections in the dialing, active, and idle states. Default is 0 (unlimited).
          max_idle_conns:
            type: int
            doc: MaxIdleConns is used to set a limit to the maximum idle HTTP connections the client can keep open. By default, it is set to 100. Zero means no limit.
          max_idle_conns_per_host:
            type: int
            doc: MaxIdleConnsPerHost is used to set a limit to the maximum idle HTTP connections the host can keep open. If zero, [net/http.DefaultMaxIdleConnsPerHost] is used.
          metrics_endpoint:
            type: string
            doc: The URL to send metrics to. If omitted the Endpoint + "/v1/metrics" will be used.
          middlewares:
            type: list
            children:
              item:
                type: map
                children:
                  id:
                    type: map
                    open: true
                    doc: ID specifies the name of the extension to use.
                doc: Middleware defines the extension ID for a middleware component.
            doc: Middlewares are used to add custom functionality to the HTTP client. Middleware handlers are called in the order they appear in this list, with the first middleware becoming the outermost handler.
          profiles_endpoint:
            type: string
            doc: The URL to send profiles to. If omitted the Endpoint + "/v1development/profiles" will be used.
          proxy_url:
            type: string
            doc: ProxyURL setting for the collector
          read_buffer_size:
            type: int
            doc: ReadBufferSize for HTTP client. See http.Transport.ReadBufferSize. Default is 0.
          retry_on_failure:
            type: map
            children:
              enabled:
                type: bool
                doc: Enabled indicates whether to not retry sending batches in case of export failure.
              initial_interval:
                type: duration
                doc: InitialInterval the time to wait after the first failure before retrying.
              max_elapsed_time:
                type: duration
                doc: MaxElapsedTime is the maximum amount of time (including retries) spent trying to send a request/batch. Once this value is reached, the data is discarded. If set to 0, the retries are never stopped.
              max_interval:
                type: duration
                doc: MaxInterval is the upper bound on backoff interval. Once this value is reached the delay between consecutive retries will always be `MaxInterval`.
              multiplier:
                type: float
                doc: Multiplier is the value multiplied by the backoff interval bounds
              randomization_factor:
                type: float
                doc: RandomizationFactor is a random factor used to calculate next backoffs Randomized interval = RetryInterval * (1 ± RandomizationFactor)
            doc: BackOffConfig defines configuration for retrying batches in case of export failure. The current supported strategy is exponential backoff.
          sending_queue:
            type: map
            children:
              batch:
                type: map
                children:
                  flush_timeout:
                    type: duration
                    doc: FlushTimeout sets the time after which a batch will be sent regardless of its size.
                  max_size:
                    type: int
                    doc: MaxSize defines the configuration for the maximum size of a batch.
                  min_size:
                    type: int
                    doc: MinSize defines the configuration for the minimum size of a batch.
                  partition:
                    type: map
                    children:
                      metadata_keys:
                        type: list
                        children:
                          item:
                            type: string
                        doc: MetadataKeys is a list of client.Metadata keys that will be used to partition the data into batches. If this setting is empty, a single batcher instance will be used. When this setting is not empty, one batcher will be used per distinct combination of values for the listed metadata keys. Empty value and unset metadata are treated as distinct cases. Entries are case-insensitive. Duplicated entries will trigger a validation error.
                    doc: Partition defines the partitioning of the batches configuration.
                  sizer:
                    type: map
                    open: true
                    doc: Sizer determines the type of size measurement used by the batch. If not configured, use the same configuration as the queue. It accepts "requests", "items", or "bytes".
                doc: BatchConfig it configures how the requests are consumed from the queue and batch together during consumption.
              block_on_overflow:
                type: bool
                doc: BlockOnOverflow determines the behavior when the component's TotalSize limit is reached. If true, the component will wait for space; otherwise, operations will immediately return a retryable error.
              enabled:
                type: bool
                doc: Enabled indicates whether to not enqueue and batch before exporting.
              num_consumers:
                type: int
                doc: NumConsumers is the maximum number of concurrent consumers from the queue. This applies across all different optional configurations from above (e.g. wait_for_result, block_on_overflow, storage, etc.).
              queue_size:
                type: int
                doc: QueueSize represents the maximum data size allowed for concurrent storage and processing.
              sizer:
                type: map
                open: true
                doc: Sizer determines the type of size measurement used by this component. It accepts "requests", "items", or "bytes".
              storage:
                type: map
                open: true
                doc: 'StorageID if not empty, enables the persistent storage and uses the component specified as a storage extension for the persistent queue. TODO: This will be changed to Optional when available. See https://github.com/open-telemetry/opentelemetry-collector/issues/13822'
              wait_for_result:
                type: bool
                doc: WaitForResult determines if incoming requests are blocked until the request is processed or not. Currently, this option is not available when persistent queue is configured using the storage configuration.
            doc: QueueBatchConfig defines configuration for queueing and batching for the exporter.
          timeout:
            type: duration
            doc: Timeout parameter configures `http.Client.Timeout`. Default is 0 (unlimited).
          tls:
            type: map
            children:
              ca_file:
                type: string
                doc: Path to the CA cert. For a client this verifies the server certificate. For a server this verifies client certificates. If empty uses system root CA. (optional)
              ca_pem:
                type: string
                doc: In memory PEM encoded cert. (optional)
              cert_file:
                type: string
                doc: Path to the TLS cert to use for TLS required connections. (optional)
              cert_pem:
                type: string
                doc: In memory PEM encoded TLS cert to use for TLS required connections. (optional)
              cipher_suites:
                type: list
                children:
                  item:
                    type: string
                doc: CipherSuites is a list of TLS cipher suites that the TLS transport can use. If left blank, a safe default list is used. See https://go.dev/src/crypto/tls/cipher_suites.go for a list of supported cipher suites.
              curve_preferences:
                type: list
                children:
                  item:
                    type: string
                doc: contains the elliptic curves that will be used in an ECDHE handshake, in preference order Defaults to empty list and "crypto/tls" defaults are used, internally.
              include_insecure_cipher_suites:
                type: bool
              include_system_ca_certs_pool:
                type: bool
                doc: If true, load system CA certificates pool in addition to the certificates configured in this struct.
              insecure:
                type: bool
                doc: In gRPC and HTTP when set to true, this is used to disable the client transport security. See https://godoc.org/google.golang.org/grpc#WithInsecure for gRPC. Please refer to https://godoc.org/crypto/tls#Config for more information. (optional, default false)
              insecure_skip_verify:
                type: bool
                doc: InsecureSkipVerify will enable TLS but not verify the certificate.
              key_file:
                type: string
                doc: Path to the TLS key to use for TLS required connections. (optional)
              key_pem:
                type: string
                doc: In memory PEM encoded TLS key to use for TLS required connections. (optional)
              max_version:
                type: string
                doc: MaxVersion sets the maximum TLS version that is acceptable. If not set, refer to crypto/tls for defaults. (optional)
              min_version:
                type: string
                doc: MinVersion sets the minimum TLS version that is acceptable. If not set, TLS 1.2 will be used. (optional)
              reload_interval:
                type: duration
                doc: ReloadInterval specifies the duration after which the certificate will be reloaded If not set, it will never be reloaded (optional)
              server_name_override:
                type: string
                doc: ServerName requested by client for virtual hosting. This sets the ServerName in the TLSConfig. Please refer to https://godoc.org/crypto/tls#Config for more information. (optional)
              tpm:
                type: map
                children:
                  auth:
                    type: string
                  enabled:
                    type: bool
                  owner_auth:
                    type: string
                  path:
                    type: string
                    doc: The path to the TPM device or Unix domain socket. For instance /dev/tpm0 or /dev/tpmrm0.
                doc: Trusted platform module configuration
            doc: TLS struct exposes TLS client configuration.
          traces_endpoint:
            type: string
            doc: The URL to send traces to. If omitted the Endpoint + "/v1/traces" will be used.
          write_buffer_size:
            type: int
            doc: WriteBufferSize for HTTP client. See http.Transport.WriteBufferSize. Default is 0.
        doc: Config defines configuration for OTLP/HTTP exporter.
    prometheus:
      type: prometheus
      signals:
        - metrics
      stability:
        metrics: beta
      distributions:
        - core
        - contrib
      module: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/prometheusexporter
      fields:
        type: map
        children:
          add_metric_suffixes:
            type: bool
            doc: 'AddMetricSuffixes controls whether suffixes are added to metric names. Defaults to true. Deprecated: Use TranslationStrategy instead. This setting is ignored when TranslationStrategy is explicitly set.'
          auth:
            type: map
            children:
              authenticator:
                type: map
                open: true
                doc: AuthenticatorID specifies the name of the extension to use in order to authenticate the incoming data point.
              request_params:
                type: list
                children:
                  item:
                    type: string
                doc: RequestParameters is a list of parameters that should be extracted from the request and added to the context. When a parameter is found in both the query string and the header, the value from the query string will be used.
            doc: Auth for this receiver
          compression_algorithms:
            type: list
            children:
              item:
                type: string
            doc: 'CompressionAlgorithms configures the list of compression algorithms the server can accept. Default: ["", "gzip", "zstd", "zlib", "snappy", "deflate"]'
          const_labels:
            type: map
            open: true
            doc: ConstLabels are values that are applied for every exported metric.
          cors:
            type: map
            children:
              allowed_headers:
                type: list
                children:
                  item:
                    type: string
                doc: AllowedHeaders sets what headers will be allowed in CORS requests. The Accept, Accept-Language, Content-Type, and Content-Language headers are implicitly allowed. If no headers are listed, X-Requested-With will also be accepted by default. Include "*" to allow any request header.
              allowed_origins:
                type: list
                children:
                  item:
                    type: string
                doc: AllowedOrigins sets the allowed values of the Origin header for HTTP/JSON requests to an OTLP receiver. An origin may contain a wildcard (*) to replace 0 or more characters (e.g., "http://*.domain.com", or "*" to allow any origin).
              exposed_headers:
                type: list
                children:
                  item:
                    type: string
                doc: ExposedHeaders sets the value of the Access-Control-Expose-Headers response header, indicating which headers are safe to expose to the API of a CORS response.
              max_age:
                type: int
                doc: MaxAge sets the value of the Access-Control-Max-Age response header. Set it to the number of seconds that browsers should cache a CORS preflight response for.
            doc: CORS configures the server for HTTP cross-origin resource sharing (CORS).
          dialer:
            type: map
            children:
              timeout:
                type: duration
          enable_open_metrics:
            type: bool
            doc: EnableOpenMetrics enables the use of the OpenMetrics encoding option for the prometheus exporter.
          endpoint:
            type: string
            doc: Endpoint configures the listening address for the server.
          idle_timeout:
            type: duration
            doc: IdleTimeout is the maximum amount of time to wait for the next request when keep-alives are enabled. If IdleTimeout is zero, the value of ReadTimeout is used. If both are zero, there is no timeout.
          include_metadata:
            type: bool
            doc: IncludeMetadata propagates the client metadata from the incoming requests to the downstream consumers
          keep_alives_enabled:
            type: bool
            doc: KeepAlivesEnabled controls whether HTTP keep-alives are enabled. By default, keep-alives are always enabled. Only very resource-constrained environments should disable them.
          max_request_body_size:
            type: int
            doc: 'MaxRequestBodySize sets the maximum request body size in bytes. Default: 20MiB.'
          metric_expiration:
            type: duration
            doc: MetricExpiration defines how long metrics are kept without updates
          middlewares:
            type: list
            children:
              item:
                type: map
                children:
                  id:
                    type: map
                    open: true
                    doc: ID specifies the name of the extension to use.
                doc: Middleware defines the extension ID for a middleware component.
            doc: Middlewares are used to add custom functionality to the HTTP server. Middleware handlers are called in the order they appear in this list, with the first middleware becoming the outermost handler.
          namespace:
            type: string
            doc: Namespace if set, exports metrics under the provided value.
          read_header_timeout:
            type: duration
            doc: ReadHeaderTimeout is the amount of time allowed to read request headers. The connection's read deadline is reset after reading the headers and the Handler can decide what is considered too slow for the body. If ReadHeaderTimeout is zero, the value of ReadTimeout is used. If both are zero, there is no timeout.
          read_timeout:
            type: duration
            doc: ReadTimeout is the maximum duration for reading the entire request, including the body. A zero or negative value means there will be no timeout. Because ReadTimeout does not let Handlers make per-request decisions on each request body's acceptable deadline or upload rate, most users will prefer to use ReadHeaderTimeout. It is valid to use them both.
          resource_to_telemetry_conversion:
            type: map
            children:
              enabled:
                type: bool
                doc: Enabled indicates whether to convert resource attributes to telemetry attributes. Default is `false`.
              exclude_service_attributes:
                type: bool
                doc: ExcludeServiceAttributes indicates whether to exclude `service.name`, `service.instance.id` and `service.namespace` resource attributes from being converted to metric attributes. Default is `false`. When set to `true`, these attributes will not be added to metric labels since they are already mapped to Prometheus `job` and `instance` labels respectively.
            doc: ResourceToTelemetrySettings defines configuration for converting resource attributes to metric labels.
          response_headers:
            children:
              item:
                type: map
                children:
                  name:
                    type: string
                  value:
                    type: string
                    doc: String alias that is marshaled and printed in an opaque way. To recover the original value, cast it to a string.
                doc: Pair is an element of a MapList, and consists of a name and an opaque value.
            doc: Additional headers attached to each HTTP response sent to the client. Header values are opaque since they may be sensitive.
          send_timestamps:
            type: bool
            doc: SendTimestamps will send the underlying scrape timestamp with the export
          sending_queue:
            type: map
            children:
              batch:
                type: map
                children:
                  flush_timeout:
                    type: duration
                    doc: FlushTimeout sets the time after which a batch will be sent regardless of its size.
                  max_size:
                    type: int
                    doc: MaxSize defines the configuration for the maximum size of a batch.
                  min_size:
                    type: int
                    doc: MinSize defines the configuration for the minimum size of a batch.
                  partition:
                    type: map
                    children:
                      metadata_keys:
                        type: list
                        children:
                          item:
                            type: string
                        doc: MetadataKeys is a list of client.Metadata keys that will be used to partition the data into batches. If this setting is empty, a single batcher instance will be used. When this setting is not empty, one batcher will be used per distinct combination of values for the listed metadata keys. Empty value and unset metadata are treated as distinct cases. Entries are case-insensitive. Duplicated entries will trigger a validation error.
                    doc: Partition defines the partitioning of the batches configuration.
                  sizer:
                    type: map
                    open: true
                    doc: Sizer determines the type of size measurement used by the batch. If not configured, use the same configuration as the queue. It accepts "requests", "items", or "bytes".
                doc: BatchConfig it configures how the requests are consumed from the queue and batch together during consumption.
              block_on_overflow:
                type: bool
                doc: BlockOnOverflow determines the behavior when the component's TotalSize limit is reached. If true, the component will wait for space; otherwise, operations will immediately return a retryable error.
              enabled:
                type: bool
                doc: Enabled indicates whether to not enqueue and batch before exporting.
              num_consumers:
                type: int
                doc: NumConsumers is the maximum number of concurrent consumers from the queue. This applies across all different optional configurations from above (e.g. wait_for_result, block_on_overflow, storage, etc.).
              queue_size:
                type: int
                doc: QueueSize represents the maximum data size allowed for concurrent storage and processing.
              sizer:
                type: map
                open: true
                doc: Sizer determines the type of size measurement used by this component. It accepts "requests", "items", or "bytes".
              storage:
                type: map
                open: true
                doc: 'StorageID if not empty, enables the persistent storage and uses the component specified as a storage extension for the persistent queue. TODO: This will be changed to Optional when available. See https://github.com/open-telemetry/opentelemetry-collector/issues/13822'
              wait_for_result:
                type: bool
                doc: WaitForResult determines if incoming requests are blocked until the request is processed or not. Currently, this option is not available when persistent queue is configured using the storage configuration.
            doc: QueueBatchConfig defines the queue configuration.
          tls:
            type: map
            children:
              ca_file:
                type: string
                doc: Path to the CA cert. For a client this verifies the server certificate. For a server this verifies client certificates. If empty uses system root CA. (optional)
              ca_pem:
                type: string
                doc: In memory PEM encoded cert. (optional)
              cert_file:
                type: string
                doc: Path to the TLS cert to use for TLS required connections. (optional)
              cert_pem:
                type: string
                doc: In memory PEM encoded TLS cert to use for TLS required connections. (optional)
              cipher_suites:
                type: list
                children:
                  item:
                    type: string
                doc: CipherSuites is a list of TLS cipher suites that the TLS transport can use. If left blank, a safe default list is used. See https://go.dev/src/crypto/tls/cipher_suites.go for a list of supported cipher suites.
              client_ca_file:
                type: string
                doc: Path to the TLS cert to use by the server to verify a client certificate. (optional) This sets the ClientCAs and ClientAuth to RequireAndVerifyClientCert in the TLSConfig. Please refer to https://godoc.org/crypto/tls#Config for more information. (optional)
              client_ca_file_reload:
                type: bool
                doc: Reload the ClientCAs file when it is modified (optional, default false)
              curve_preferences:
                type: list
                children:
                  item:
                    type: string
                doc: contains the elliptic curves that will be used in an ECDHE handshake, in preference order Defaults to empty list and "crypto/tls" defaults are used, internally.
              include_insecure_cipher_suites:
                type: bool
              include_system_ca_certs_pool:
                type: bool
                doc: If true, load system CA certificates pool in addition to the certificates configured in this struct.
              key_file:
                type: string
                doc: Path to the TLS key to use for TLS required connections. (optional)
              key_pem:
                type: string
                doc: In memory PEM encoded TLS key to use for TLS required connections. (optional)
              max_version:
                type: string
                doc: MaxVersion sets the maximum TLS version that is acceptable. If not set, refer to crypto/tls for defaults. (optional)
              min_version:
                type: string
                doc: MinVersion sets the minimum TLS version that is acceptable. If not set, TLS 1.2 will be used. (optional)
              reload_interval:
                type: duration
                doc: ReloadInterval specifies the duration after which the certificate will be reloaded If not set, it will never be reloaded (optional)
              tpm:
                type: map
                children:
                  auth:
                    type: string
                  enabled:
                    type: bool
                  owner_auth:
                    type: string
                  path:
                    type: string
                    doc: The path to the TPM device or Unix domain socket. For instance /dev/tpm0 or /dev/tpmrm0.
                doc: Trusted platform module configuration
            doc: TLS struct exposes TLS client configuration.
          translation_strategy:
            type: string
            doc: TranslationStrategy controls how OTLP metric and attribute names are translated into Prometheus metric and label names. When set, this takes precedence over AddMetricSuffixes.
          transport:
            type: string
          without_scope_info:
            type: bool
            doc: WithoutScopeInfo controls the addition of labels for the instrumentation scope.
