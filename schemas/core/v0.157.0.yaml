collectorVersion: v0.157.0
distribution: core
distributions:
  - core
  - contrib
generatedAt: "2026-08-02T13:07:26Z"
sources:
  contrib: github.com/open-telemetry/opentelemetry-collector-contrib
  core: go.opentelemetry.io/collector
components:
  connector:
    forward:
      type: forward
      stability:
        logs_to_logs: beta
        metrics_to_metrics: beta
        profiles_to_profiles: alpha
        traces_to_traces: beta
      pairs:
        - from: logs
          to: logs
        - from: metrics
          to: metrics
        - from: profiles
          to: profiles
        - from: traces
          to: traces
      distributions:
        - core
        - contrib
        - k8s
      module: go.opentelemetry.io/collector/connector/forwardconnector
  exporter:
    debug:
      type: debug
      signals:
        - traces
        - metrics
        - logs
        - profiles
      stability:
        logs: alpha
        metrics: alpha
        profiles: alpha
        traces: alpha
      distributions:
        - core
        - contrib
        - k8s
      module: go.opentelemetry.io/collector/exporter/debugexporter
      fields:
        type: map
        children:
          sampling_initial:
            type: int
            doc: messages logged per second before sampling kicks in
          sampling_thereafter:
            type: int
            doc: log one in every N messages after the initial burst
          use_internal_logger:
            type: bool
          verbosity:
            type: string
            enum:
              - basic
              - normal
              - detailed
            doc: how much of each payload is written to the collector log
    file:
      type: file
      signals:
        - traces
        - metrics
        - logs
        - profiles
      stability:
        logs: alpha
        metrics: alpha
        profiles: development
        traces: alpha
      distributions:
        - core
        - contrib
        - k8s
      module: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/fileexporter
      fields:
        type: map
        children:
          append:
            type: bool
            doc: 'Mode defines whether the exporter should append to the file. Options: - false[default]:  truncates the file - true:  appends to the file.'
          compression:
            type: string
            doc: Compression Codec used to export telemetry data Supported compression algorithms:`zstd`
          compression_params:
            type: map
            children:
              level:
                type: int
            doc: 'CompressionParams defines compression parameters. For zstd the following levels are supported: - SpeedFastest: 1 - SpeedDefault: 3 - SpeedBetterCompression: 6 - SpeedBestCompression: 11'
          create_directory:
            type: bool
            doc: CreateDirectory specifies that the parent directory of the output file should be created automatically on start.
          directory_permissions:
            type: string
            doc: DirectoryPermissions specifies permissions used when creating directories (minus process umask). Value must be an octal string like "0755".
          encoding:
            type: map
            open: true
            doc: Encoding defines the encoding of the telemetry data. If specified, it overrides `FormatType` and applies an encoding extension.
          flush_interval:
            type: duration
            doc: FlushInterval is the duration between flushes. See time.ParseDuration for valid values.
          format:
            type: string
            doc: 'FormatType define the data format of encoded telemetry data Options: - json[default]:  OTLP json bytes. - proto:  OTLP binary protobuf bytes.'
          group_by:
            type: map
            children:
              enabled:
                type: bool
                doc: Enables group_by. Default is false.
              max_open_files:
                type: int
                doc: MaxOpenFiles specifies the maximum number of open file descriptors for the output files. The default is 100.
              resource_attribute:
                type: string
                doc: ResourceAttribute specifies the name of the resource attribute that contains the path segment of the file to write to. The final path will be the Path config value, with the * replaced with the value of this resource attribute. Default is "fileexporter.path_segment".
            doc: GroupBy enables writing to separate files based on a resource attribute.
          path:
            type: string
            doc: Path of the file to write to. Path is relative to current directory.
          rotation:
            type: map
            children:
              localtime:
                type: bool
                doc: LocalTime determines if the time used for formatting the timestamps in backup files is the computer's local time.  The default is to use UTC time.
              max_backups:
                type: int
                doc: MaxBackups is the maximum number of old log files to retain. The default is to 100 files.
              max_days:
                type: int
                doc: MaxDays is the maximum number of days to retain old log files based on the timestamp encoded in their filename.  Note that a day is defined as 24 hours and may not exactly correspond to calendar days due to daylight savings, leap seconds, etc. The default is not to remove old log files based on age.
              max_megabytes:
                type: int
                doc: MaxMegabytes is the maximum size in megabytes of the file before it gets rotated. It defaults to 100 megabytes.
            doc: Rotation defines an option about rotation of telemetry files.
        doc: Config defines configuration for file exporter.
    kafka:
      type: kafka
      signals:
        - traces
        - metrics
        - logs
        - profiles
      stability:
        logs: beta
        metrics: beta
        profiles: development
        traces: beta
      distributions:
        - core
        - contrib
      module: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/kafkaexporter
      fields:
        type: map
        children:
          auth:
            type: map
            children:
              kerberos:
                type: map
                children:
                  config_file:
                    type: string
                  disable_fast_negotiation:
                    type: bool
                  keytab_file:
                    type: string
                  password:
                    type: string
                  realm:
                    type: string
                  service_name:
                    type: string
                  use_keytab:
                    type: bool
                  username:
                    type: string
                doc: Kerberos holds Kerberos authentication configuration.
              plain_text:
                type: map
                children:
                  password:
                    type: string
                  username:
                    type: string
                doc: 'PlainText is an alias for SASL/PLAIN authentication. Deprecated [v0.123.0]: use SASL with Mechanism set to PLAIN instead.'
              sasl:
                type: map
                children:
                  aws_msk:
                    type: map
                    children:
                      region:
                        type: string
                        doc: Region is the AWS region the MSK cluster is based in
                    doc: AWSMSK holds configuration specific to AWS MSK.
                  mechanism:
                    type: string
                    doc: 'SASL Mechanism to be used, possible values are: (PLAIN, AWS_MSK_IAM_OAUTHBEARER, OAUTHBEARER, SCRAM-SHA-256 or SCRAM-SHA-512).'
                  oauthbearer_token_source:
                    type: map
                    open: true
                    doc: ID of type "extension" providing a TokenSource for OAUTHBEARER Mechanism, typically named "oauth2client"
                  password:
                    type: string
                    doc: Password to be used on authentication
                  username:
                    type: string
                    doc: Username to be used on authentication
                  version:
                    type: int
                    doc: 'Version is ignored, and exists for backwards compatibility in config parsing. Deprecated [v0.153.0]: this field is a no-op since the migration to franz-go, which negotiates the SASL handshake version automatically. This config will be removed in a future release.'
                doc: SASL holds SASL authentication configuration.
              tls:
                type: map
                children:
                  ca_file:
                    type: string
                    doc: Path to the CA cert. For a client this verifies the server certificate. For a server this verifies client certificates. If empty uses system root CA. (optional)
                  ca_pem:
                    type: string
                    doc: In memory PEM encoded cert. (optional)
                  cert_file:
                    type: string
                    doc: Path to the TLS cert to use for TLS required connections. (optional)
                  cert_pem:
                    type: string
                    doc: In memory PEM encoded TLS cert to use for TLS required connections. (optional)
                  cipher_suites:
                    type: list
                    children:
                      item:
                        type: string
                    doc: CipherSuites is a list of TLS cipher suites that the TLS transport can use. If left blank, a safe default list is used. See https://go.dev/src/crypto/tls/cipher_suites.go for a list of supported cipher suites.
                  curve_preferences:
                    type: list
                    children:
                      item:
                        type: string
                    doc: contains the elliptic curves that will be used in an ECDHE handshake, in preference order Defaults to empty list and "crypto/tls" defaults are used, internally.
                  include_insecure_cipher_suites:
                    type: bool
                  include_system_ca_certs_pool:
                    type: bool
                    doc: If true, load system CA certificates pool in addition to the certificates configured in this struct.
                  insecure:
                    type: bool
                    doc: In gRPC and HTTP when set to true, this is used to disable the client transport security. See https://godoc.org/google.golang.org/grpc#WithInsecure for gRPC. Please refer to https://godoc.org/crypto/tls#Config for more information. (optional, default false)
                  insecure_skip_verify:
                    type: bool
                    doc: InsecureSkipVerify will enable TLS but not verify the certificate.
                  key_file:
                    type: string
                    doc: Path to the TLS key to use for TLS required connections. (optional)
                  key_pem:
                    type: string
                    doc: In memory PEM encoded TLS key to use for TLS required connections. (optional)
                  max_version:
                    type: string
                    doc: MaxVersion sets the maximum TLS version that is acceptable. If not set, refer to crypto/tls for defaults. (optional)
                  min_version:
                    type: string
                    doc: MinVersion sets the minimum TLS version that is acceptable. If not set, TLS 1.2 will be used. (optional)
                  reload_interval:
                    type: duration
                    doc: ReloadInterval specifies the duration after which the certificate will be reloaded If not set, it will never be reloaded (optional)
                  server_name_override:
                    type: string
                    doc: ServerName requested by client for virtual hosting. This sets the ServerName in the TLSConfig. Please refer to https://godoc.org/crypto/tls#Config for more information. (optional)
                  tpm:
                    type: map
                    children:
                      auth:
                        type: string
                      enabled:
                        type: bool
                      owner_auth:
                        type: string
                      path:
                        type: string
                        doc: The path to the TPM device or Unix domain socket. For instance /dev/tpm0 or /dev/tpmrm0.
                    doc: Trusted platform module configuration
                doc: 'TLS holds TLS configuration for connecting to Kafka brokers. Deprecated [v0.124.0]: use ClientConfig.TLS instead. This will be used only if ClientConfig.TLS is not set.'
            doc: Authentication holds Kafka authentication details.
          brokers:
            type: list
            children:
              item:
                type: string
            doc: Brokers holds the list of Kafka bootstrap servers (default localhost:9092).
          client_id:
            type: string
            doc: ClientID holds the client ID advertised to Kafka, which can be used for enforcing ACLs, throttling quotas, and more (default "otel-collector")
          conn_idle_timeout:
            type: duration
            doc: ConnIdleTimeout specifies the time after which idle connections are not reused and may be closed.
          enabled:
            type: bool
            doc: Enabled indicates whether to not retry sending batches in case of export failure.
          include_metadata_keys:
            type: list
            children:
              item:
                type: string
            doc: IncludeMetadataKeys indicates the receiver's client metadata keys to propagate as Kafka message headers.
          initial_interval:
            type: duration
            doc: InitialInterval the time to wait after the first failure before retrying.
          logs:
            type: map
            children:
              encoding:
                type: string
                doc: Encoding holds the encoding of messages for the signal type. Defaults to "otlp_proto".
              message_key_from_metadata_key:
                type: string
                doc: MessageKeyFromMetadataKey holds the name of the metadata key whose value will be used as the Kafka record key for this signal type. If the metadata key is absent or empty the record key is left nil. Mutually exclusive with the partition_* flags for the same signal.
              topic:
                type: string
                doc: 'Topic holds the name of the Kafka topic to which messages of the signal type should be produced. The default depends on the signal type: - "otlp_spans" for traces - "otlp_metrics" for metrics - "otlp_logs" for logs - "otlp_profiles" for profiles'
              topic_from_metadata_key:
                type: string
                doc: TopicFromMetadataKey holds the name of the metadata key to use as the topic name for this signal type. If this is set, it takes precedence over the topic name set in the topic field.
            doc: Logs holds configuration about how logs should be sent to Kafka.
          max_elapsed_time:
            type: duration
            doc: MaxElapsedTime is the maximum amount of time (including retries) spent trying to send a request/batch. Once this value is reached, the data is discarded. If set to 0, the retries are never stopped.
          max_interval:
            type: duration
            doc: MaxInterval is the upper bound on backoff interval. Once this value is reached the delay between consecutive retries will always be `MaxInterval`.
          metadata:
            type: map
            children:
              full:
                type: bool
                doc: Whether to maintain a full set of metadata for all topics, or just the minimal set that has been necessary so far. The full set is simpler and usually more convenient, but can take up a substantial amount of memory if you have many topics and partitions. Defaults to true.
              refresh_interval:
                type: duration
                doc: RefreshInterval controls the frequency at which cluster metadata is refreshed. Defaults to 10 minutes.
              retry:
                type: map
                children:
                  backoff:
                    type: duration
                    doc: How long to wait for leader election to occur before retrying (default 250ms). Similar to the JVM's `retry.backoff.ms`.
                  max:
                    type: int
                    doc: The total number of times to retry a metadata request when the cluster is in the middle of a leader election or at startup (default 3).
                doc: Retry configuration for metadata. This configuration is useful to avoid race conditions when broker is starting at the same time as collector.
            doc: Metadata holds metadata-related configuration for producers and consumers.
          metrics:
            type: map
            children:
              encoding:
                type: string
                doc: Encoding holds the encoding of messages for the signal type. Defaults to "otlp_proto".
              message_key_from_metadata_key:
                type: string
                doc: MessageKeyFromMetadataKey holds the name of the metadata key whose value will be used as the Kafka record key for this signal type. If the metadata key is absent or empty the record key is left nil. Mutually exclusive with the partition_* flags for the same signal.
              topic:
                type: string
                doc: 'Topic holds the name of the Kafka topic to which messages of the signal type should be produced. The default depends on the signal type: - "otlp_spans" for traces - "otlp_metrics" for metrics - "otlp_logs" for logs - "otlp_profiles" for profiles'
              topic_from_metadata_key:
                type: string
                doc: TopicFromMetadataKey holds the name of the metadata key to use as the topic name for this signal type. If this is set, it takes precedence over the topic name set in the topic field.
            doc: Metrics holds configuration about how metrics should be sent to Kafka.
          multiplier:
            type: float
            doc: Multiplier is the value multiplied by the backoff interval bounds
          partition_logs_by_resource_attributes:
            type: bool
            doc: PartitionLogsByResourceAttributes controls the partitioning of logs messages by resource. If this is true, then the message key will be set to a hash of the resource's identifying attributes.
          partition_logs_by_trace_id:
            type: bool
            doc: PartitionLogsByTraceID controls partitioning of log messages by trace ID only. When enabled, the exporter splits incoming logs per TraceID (using SplitLogs) and sets the Kafka message key to the 16-byte hex string of that TraceID. If a LogRecord has an empty TraceID, the key may be empty and partition selection falls back to the Kafka client’s default strategy. Resource attributes are not used for the key when this option is enabled.
          partition_metrics_by_resource_attributes:
            type: bool
            doc: PartitionMetricsByResourceAttributes controls the partitioning of metrics messages by resource. If this is true, then the message key will be set to a hash of the resource's identifying attributes.
          partition_traces_by_id:
            type: bool
            doc: 'PartitionTracesByID sets the message key of outgoing trace messages to the trace ID. NOTE: this does not have any effect for Jaeger encodings. Jaeger encodings always use use the trace ID for the message key.'
          producer:
            type: map
            children:
              allow_auto_topic_creation:
                type: bool
                doc: Whether or not to allow automatic topic creation. (default enabled).
              compression:
                type: string
                doc: 'Compression Codec used to produce messages https://pkg.go.dev/github.com/twmb/franz-go/pkg/kgo#CompressionCodec The options are: ''none'' (default), ''gzip'', ''snappy'', ''lz4'', and ''zstd'''
              compression_params:
                type: map
                children:
                  level:
                    type: int
                doc: CompressionParams defines compression parameters for the producer.
              flush_max_messages:
                type: int
                doc: The maximum number of messages the producer will send in a single broker request. Defaults to 10000 (franz-go default). Similar to `queue.buffering.max.messages` in the JVM producer.
              linger:
                type: duration
                doc: Linger controls the linger time for the producer. (default 10ms).
              max_broker_write_bytes:
                type: int
                doc: MaxBrokerWriteBytes is the maximum bytes the producer will write to a broker in a single request. It must be >= MaxMessageBytes. Maps to franz-go's kgo.BrokerMaxWriteBytes, whose default (and minimum accepted value) is 100 MiB. (default 104857600)
              max_message_bytes:
                type: int
                doc: MaxMessageBytes is the maximum message bytes the producer will accept to produce. It must be less than or equal to MaxBrokerWriteBytes, and must fit in an int32 as it maps to franz-go's kgo.ProducerBatchMaxBytes. (default 1000000)
              required_acks:
                type: int
                doc: 'RequiredAcks holds the number acknowledgements required before producing returns successfully. See: https://docs.confluent.io/platform/current/installation/configuration/producer-configs.html#acks Acceptable values are: 0 (NoResponse)   Does not wait for any acknowledgements. 1 (WaitForLocal) Waits for only the leader to write the record to its local log, but does not wait for followers to acknowledge. (default) -1 (WaitForAll)   Waits for all in-sync replicas to acknowledge. In YAML configuration, "all" is accepted as an alias for -1.'
          profiles:
            type: map
            children:
              encoding:
                type: string
                doc: Encoding holds the encoding of messages for the signal type. Defaults to "otlp_proto".
              message_key_from_metadata_key:
                type: string
                doc: MessageKeyFromMetadataKey holds the name of the metadata key whose value will be used as the Kafka record key for this signal type. If the metadata key is absent or empty the record key is left nil. Mutually exclusive with the partition_* flags for the same signal.
              topic:
                type: string
                doc: 'Topic holds the name of the Kafka topic to which messages of the signal type should be produced. The default depends on the signal type: - "otlp_spans" for traces - "otlp_metrics" for metrics - "otlp_logs" for logs - "otlp_profiles" for profiles'
              topic_from_metadata_key:
                type: string
                doc: TopicFromMetadataKey holds the name of the metadata key to use as the topic name for this signal type. If this is set, it takes precedence over the topic name set in the topic field.
            doc: Profiles holds configuration about how profiles should be sent to Kafka.
          protocol_version:
            type: string
            doc: ProtocolVersion defines the Kafka protocol version that the client will assume it is running against.
          rack_id:
            type: string
            doc: RackID provides the rack identifier for this client to enable rack-aware replica selection when supported by the brokers. This maps to Kafka's standard "client.rack" setting. By default, this is empty.
          randomization_factor:
            type: float
            doc: RandomizationFactor is a random factor used to calculate next backoffs Randomized interval = RetryInterval * (1 ± RandomizationFactor)
          record_headers:
            type: list
            children:
              item:
                type: map
                children:
                  name:
                    type: string
                  value:
                    type: string
            doc: RecordHeaders sets static headers on every outgoing Kafka record.
          record_partitioner:
            type: map
            children:
              extension:
                type: map
                open: true
                doc: Extension is the component ID of an extension implementing RecordPartitionerExtension. Setting this field delegates partition assignment to that extension.
              least_backup:
                open: true
                doc: LeastBackup routes each record to the partition with the fewest buffered records.
              round_robin:
                open: true
                doc: RoundRobin distributes records evenly across all available partitions in round-robin order.
              sticky_key:
                type: map
                children:
                  hasher:
                    type: string
                    doc: 'Hasher is the hash algorithm used for key-based partition assignment. Valid values: "sarama_compat" (default). - "sarama_compat": Sarama-compatible FNV-1a hashing (SaramaCompatHasher). - "murmur2": Murmur2 hashing.'
                doc: StickyKey uses StickyKeyPartitioner. When a record key is set, the partition is derived from the key hash.
            doc: RecordPartitioner configures how Kafka records are assigned to partitions. The default ("sarama_compatible") retains the legacy Sarama-compatible hashing behavior. Set to "sticky", "round_robin", or "least_backup" to use one of the built-in franz-go partitioners, or "extension" to delegate to a custom extension.
          resolve_canonical_bootstrap_servers_only:
            type: bool
            doc: 'ResolveCanonicalBootstrapServersOnly is ignored, and exists for backwards compatibility in config parsing. Deprecated [v0.153.0]: this field is a no-op since the migration to franz-go, which has no direct equivalent to the associated Sarama config. This config will be removed in a future release.'
          retry_on_failure:
            type: map
            children:
              enabled:
                type: bool
              initial_interval:
                type: duration
              max_elapsed_time:
                type: duration
              max_interval:
                type: duration
              multiplier:
                type: float
              randomization_factor:
                type: float
          sending_queue:
            type: map
            children:
              batch:
                type: map
                children:
                  flush_timeout:
                    type: duration
                    doc: FlushTimeout sets the time after which a batch will be sent regardless of its size.
                  max_size:
                    type: int
                    doc: MaxSize defines the configuration for the maximum size of a batch.
                  min_size:
                    type: int
                    doc: MinSize defines the configuration for the minimum size of a batch.
                  partition:
                    type: map
                    children:
                      metadata_keys:
                        type: list
                        children:
                          item:
                            type: string
                        doc: MetadataKeys is a list of client.Metadata keys that will be used to partition the data into batches. If this setting is empty, a single batcher instance will be used. When this setting is not empty, one batcher will be used per distinct combination of values for the listed metadata keys. Empty value and unset metadata are treated as distinct cases. Entries are case-insensitive. Duplicated entries will trigger a validation error.
                    doc: Partition defines the partitioning of the batches configuration.
                  sizer:
                    type: map
                    open: true
                    doc: Sizer determines the type of size measurement used by the batch. If not configured, use the same configuration as the queue. It accepts "requests", "items", or "bytes".
                doc: BatchConfig it configures how the requests are consumed from the queue and batch together during consumption.
              block_on_overflow:
                type: bool
                doc: BlockOnOverflow determines the behavior when the component's TotalSize limit is reached. If true, the component will wait for space; otherwise, operations will immediately return a retryable error.
              enabled:
                type: bool
                doc: Enabled indicates whether to not enqueue and batch before exporting.
              num_consumers:
                type: int
                doc: NumConsumers is the maximum number of concurrent consumers from the queue. This applies across all different optional configurations from above (e.g. wait_for_result, block_on_overflow, storage, etc.).
              queue_size:
                type: int
                doc: QueueSize represents the maximum data size allowed for concurrent storage and processing.
              sizer:
                type: map
                open: true
                doc: Sizer determines the type of size measurement used by this component. It accepts "requests", "items", or "bytes".
              storage:
                type: map
                open: true
                doc: 'StorageID if not empty, enables the persistent storage and uses the component specified as a storage extension for the persistent queue. TODO: This will be changed to Optional when available. See https://github.com/open-telemetry/opentelemetry-collector/issues/13822'
              wait_for_result:
                type: bool
                doc: WaitForResult determines if incoming requests are blocked until the request is processed or not. Currently, this option is not available when persistent queue is configured using the storage configuration.
            doc: QueueBatchConfig defines configuration for queueing and batching for the exporter.
          timeout:
            type: duration
            doc: Timeout is the timeout for every attempt to send data to the backend. A zero timeout means no timeout.
          tls:
            type: map
            children:
              ca_file:
                type: string
                doc: Path to the CA cert. For a client this verifies the server certificate. For a server this verifies client certificates. If empty uses system root CA. (optional)
              ca_pem:
                type: string
                doc: In memory PEM encoded cert. (optional)
              cert_file:
                type: string
                doc: Path to the TLS cert to use for TLS required connections. (optional)
              cert_pem:
                type: string
                doc: In memory PEM encoded TLS cert to use for TLS required connections. (optional)
              cipher_suites:
                type: list
                children:
                  item:
                    type: string
                doc: CipherSuites is a list of TLS cipher suites that the TLS transport can use. If left blank, a safe default list is used. See https://go.dev/src/crypto/tls/cipher_suites.go for a list of supported cipher suites.
              curve_preferences:
                type: list
                children:
                  item:
                    type: string
                doc: contains the elliptic curves that will be used in an ECDHE handshake, in preference order Defaults to empty list and "crypto/tls" defaults are used, internally.
              include_insecure_cipher_suites:
                type: bool
              include_system_ca_certs_pool:
                type: bool
                doc: If true, load system CA certificates pool in addition to the certificates configured in this struct.
              insecure:
                type: bool
                doc: In gRPC and HTTP when set to true, this is used to disable the client transport security. See https://godoc.org/google.golang.org/grpc#WithInsecure for gRPC. Please refer to https://godoc.org/crypto/tls#Config for more information. (optional, default false)
              insecure_skip_verify:
                type: bool
                doc: InsecureSkipVerify will enable TLS but not verify the certificate.
              key_file:
                type: string
                doc: Path to the TLS key to use for TLS required connections. (optional)
              key_pem:
                type: string
                doc: In memory PEM encoded TLS key to use for TLS required connections. (optional)
              max_version:
                type: string
                doc: MaxVersion sets the maximum TLS version that is acceptable. If not set, refer to crypto/tls for defaults. (optional)
              min_version:
                type: string
                doc: MinVersion sets the minimum TLS version that is acceptable. If not set, TLS 1.2 will be used. (optional)
              reload_interval:
                type: duration
                doc: ReloadInterval specifies the duration after which the certificate will be reloaded If not set, it will never be reloaded (optional)
              server_name_override:
                type: string
                doc: ServerName requested by client for virtual hosting. This sets the ServerName in the TLSConfig. Please refer to https://godoc.org/crypto/tls#Config for more information. (optional)
              tpm:
                type: map
                children:
                  auth:
                    type: string
                  enabled:
                    type: bool
                  owner_auth:
                    type: string
                  path:
                    type: string
                    doc: The path to the TPM device or Unix domain socket. For instance /dev/tpm0 or /dev/tpmrm0.
                doc: Trusted platform module configuration
            doc: TLS holds TLS-related configuration for connecting to Kafka brokers. By default the client will use an insecure connection unless SASL/AWS_MSK_IAM_OAUTHBEARER auth is configured.
          topic_from_attribute:
            type: string
            doc: TopicFromAttribute is the name of the attribute to use as the topic name.
