                    type: string
            doc: HeaderExtraction controls extraction of headers from Kafka records.
          heartbeat_interval:
            type: duration
            doc: HeartbeatInterval controls the Kafka consumer group coordination heartbeat interval. Heartbeats ensure the consumer's session remains active.
          initial_offset:
            type: string
            doc: InitialOffset specifies the initial offset to use if no offset was previously committed. Must be `latest` or `earliest` (default "latest").
          logs:
            type: map
            children:
              encoding:
                type: string
                doc: Encoding holds the expected encoding of messages for the signal type Defaults to "otlp_proto".
              exclude_topics:
                type: list
                children:
                  item:
                    type: string
                doc: Optional exclude topics option, used only in regex mode.
              topics:
                type: list
                children:
                  item:
                    type: string
                doc: 'Topics holds the name of the Kafka topics from which messages of the signal type should be consumed. The default depends on the signal type: - "otlp_spans" for traces - "otlp_metrics" for metrics - "otlp_logs" for logs - "otlp_profiles" for profiles'
            doc: Logs holds configuration about how logs should be consumed.
          max_fetch_size:
            type: int
            doc: The maximum bytes per fetch from Kafka (default "1048576")
          max_fetch_wait:
            type: duration
            doc: The maximum amount of time to wait for MinFetchSize bytes to be available before the broker returns a response (default 250ms)
          max_partition_fetch_size:
            type: int
            doc: MaxPartitionFetchSize defines the maximum number of bytes to fetch per partition (default "1048576")
          message_marking:
            type: map
            children:
              after:
                type: bool
                doc: If true, the messages are marked after the pipeline execution
              on_error:
                type: bool
                doc: 'If false, only the successfully processed messages are marked. This only applies to non-permanent errors. It has no impact if After is set to false. Note: this can block the entire partition in case a message processing returns a non-permanent error.'
              on_permanent_error:
                type: bool
                doc: 'If false, only the successfully processed messages are marked. This only applies to permanent errors. It has no impact if After is set to false. Default value inherits from OnError for backward compatibility. Note: this can block the entire partition in case a message processing returns a permanent error.'
            doc: MessageMarking controls the way the messages are marked as consumed.
          metadata:
            type: map
            children:
              full:
                type: bool
                doc: Whether to maintain a full set of metadata for all topics, or just the minimal set that has been necessary so far. The full set is simpler and usually more convenient, but can take up a substantial amount of memory if you have many topics and partitions. Defaults to true.
              refresh_interval:
                type: duration
                doc: RefreshInterval controls the frequency at which cluster metadata is refreshed. Defaults to 10 minutes.
              retry:
                type: map
                children:
                  backoff:
                    type: duration
                    doc: How long to wait for leader election to occur before retrying (default 250ms). Similar to the JVM's `retry.backoff.ms`.
                  max:
                    type: int
                    doc: The total number of times to retry a metadata request when the cluster is in the middle of a leader election or at startup (default 3).
                doc: Retry configuration for metadata. This configuration is useful to avoid race conditions when broker is starting at the same time as collector.
            doc: Metadata holds metadata-related configuration for producers and consumers.
          metrics:
            type: map
            children:
              encoding:
                type: string
                doc: Encoding holds the expected encoding of messages for the signal type Defaults to "otlp_proto".
              exclude_topics:
                type: list
                children:
                  item:
                    type: string
                doc: Optional exclude topics option, used only in regex mode.
              topics:
                type: list
                children:
                  item:
                    type: string
                doc: 'Topics holds the name of the Kafka topics from which messages of the signal type should be consumed. The default depends on the signal type: - "otlp_spans" for traces - "otlp_metrics" for metrics - "otlp_logs" for logs - "otlp_profiles" for profiles'
            doc: Metrics holds configuration about how metrics should be consumed.
          min_fetch_size:
            type: int
            doc: The minimum bytes per fetch from Kafka (default "1")
          profiles:
            type: map
            children:
              encoding:
                type: string
                doc: Encoding holds the expected encoding of messages for the signal type Defaults to "otlp_proto".
              exclude_topics:
                type: list
                children:
                  item:
                    type: string
                doc: Optional exclude topics option, used only in regex mode.
              topics:
                type: list
                children:
                  item:
                    type: string
                doc: 'Topics holds the name of the Kafka topics from which messages of the signal type should be consumed. The default depends on the signal type: - "otlp_spans" for traces - "otlp_metrics" for metrics - "otlp_logs" for logs - "otlp_profiles" for profiles'
            doc: Profiles holds configuration about how profiles should be consumed.
          protocol_version:
            type: string
            doc: ProtocolVersion defines the Kafka protocol version that the client will assume it is running against.
          rack_id:
            type: string
            doc: RackID provides the rack identifier for this client to enable rack-aware replica selection when supported by the brokers. This maps to Kafka's standard "client.rack" setting. By default, this is empty.
          resolve_canonical_bootstrap_servers_only:
            type: bool
            doc: 'ResolveCanonicalBootstrapServersOnly is ignored, and exists for backwards compatibility in config parsing. Deprecated [v0.153.0]: this field is a no-op since the migration to franz-go, which has no direct equivalent to the associated Sarama config. This config will be removed in a future release.'
          session_timeout:
            type: duration
            doc: SessionTimeout controls the Kafka consumer group session timeout. The session timeout is used to detect the consumer's liveness.
          telemetry:
            type: map
            children:
              metrics:
                type: map
                children:
                  kafka_receiver_records_delay:
                    type: map
                    children:
                      enabled:
                        type: bool
                    doc: KafkaReceiverRecordsDelay controls whether the metric kafka_receiver_records_delay that measures the time in seconds between producing and receiving a batch of records will be reported or not. This metric is not reported by default because it may slow down high-volume consuming.
                doc: MetricsConfig provides config for optional receiver metrics.
            doc: Telemetry controls optional telemetry configuration.
          tls:
            type: map
            children:
              ca_file:
                type: string
                doc: Path to the CA cert. For a client this verifies the server certificate. For a server this verifies client certificates. If empty uses system root CA. (optional)
              ca_pem:
                type: string
                doc: In memory PEM encoded cert. (optional)
              cert_file:
                type: string
                doc: Path to the TLS cert to use for TLS required connections. (optional)
              cert_pem:
                type: string
                doc: In memory PEM encoded TLS cert to use for TLS required connections. (optional)
              cipher_suites:
                type: list
                children:
                  item:
                    type: string
                doc: CipherSuites is a list of TLS cipher suites that the TLS transport can use. If left blank, a safe default list is used. See https://go.dev/src/crypto/tls/cipher_suites.go for a list of supported cipher suites.
              curve_preferences:
                type: list
                children:
                  item:
                    type: string
                doc: contains the elliptic curves that will be used in an ECDHE handshake, in preference order Defaults to empty list and "crypto/tls" defaults are used, internally.
              include_insecure_cipher_suites:
                type: bool
              include_system_ca_certs_pool:
                type: bool
                doc: If true, load system CA certificates pool in addition to the certificates configured in this struct.
              insecure:
                type: bool
                doc: In gRPC and HTTP when set to true, this is used to disable the client transport security. See https://godoc.org/google.golang.org/grpc#WithInsecure for gRPC. Please refer to https://godoc.org/crypto/tls#Config for more information. (optional, default false)
              insecure_skip_verify:
                type: bool
                doc: InsecureSkipVerify will enable TLS but not verify the certificate.
              key_file:
                type: string
                doc: Path to the TLS key to use for TLS required connections. (optional)
              key_pem:
                type: string
                doc: In memory PEM encoded TLS key to use for TLS required connections. (optional)
              max_version:
                type: string
                doc: MaxVersion sets the maximum TLS version that is acceptable. If not set, refer to crypto/tls for defaults. (optional)
              min_version:
                type: string
                doc: MinVersion sets the minimum TLS version that is acceptable. If not set, TLS 1.2 will be used. (optional)
              reload_interval:
                type: duration
                doc: ReloadInterval specifies the duration after which the certificate will be reloaded If not set, it will never be reloaded (optional)
              server_name_override:
                type: string
                doc: ServerName requested by client for virtual hosting. This sets the ServerName in the TLSConfig. Please refer to https://godoc.org/crypto/tls#Config for more information. (optional)
              tpm:
                type: map
                children:
                  auth:
                    type: string
                  enabled:
                    type: bool
                  owner_auth:
                    type: string
                  path:
                    type: string
                    doc: The path to the TPM device or Unix domain socket. For instance /dev/tpm0 or /dev/tpmrm0.
                doc: Trusted platform module configuration
            doc: TLS holds TLS-related configuration for connecting to Kafka brokers. By default the client will use an insecure connection unless SASL/AWS_MSK_IAM_OAUTHBEARER auth is configured.
          traces:
            type: map
            children:
              encoding:
                type: string
                doc: Encoding holds the expected encoding of messages for the signal type Defaults to "otlp_proto".
              exclude_topics:
                type: list
                children:
                  item:
                    type: string
                doc: Optional exclude topics option, used only in regex mode.
              topics:
                type: list
                children:
                  item:
                    type: string
                doc: 'Topics holds the name of the Kafka topics from which messages of the signal type should be consumed. The default depends on the signal type: - "otlp_spans" for traces - "otlp_metrics" for metrics - "otlp_logs" for logs - "otlp_profiles" for profiles'
            doc: Traces holds configuration about how traces should be consumed.
          use_leader_epoch:
            type: bool
            doc: 'When enabled, the consumer uses the leader epoch returned by brokers (KIP-320) to detect log truncation. Setting this to false clears the leader epoch from fetch offsets, disabling KIP-320. Disabling can improve compatibility with brokers that don’t fully support leader epochs (e.g., Azure Event Hubs), at the cost of losing automatic log-truncation safety. NOTE: this is experimental and may be removed in a future release.'
        doc: Config defines configuration for Kafka receiver.
    nop:
