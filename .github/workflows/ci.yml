name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: Check formatting
        run: |
          out=$(gofmt -l . | grep -v '^catalogs/' || true)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./cmd/otelcol-config-lint

  self-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      # The linter checks its own example configs, and annotates the pull
      # request with anything it finds.
      - run: go run ./cmd/otelcol-config-lint -output github -summary testdata/valid
