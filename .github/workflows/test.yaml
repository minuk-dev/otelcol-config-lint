name: test

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # octocov posts the coverage report as a PR comment
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.25
      - name: Run unit tests
        run: make test
      - name: Report coverage (octocov)
        uses: k1LoW/octocov-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target: [FuzzConfigParse, FuzzSettingsParse, FuzzSchemaRead, FuzzLint]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.25
      - name: Run bounded fuzz smoke test
        run: >-
          go test ./pkg/lint -run '^$' -fuzz '^${{ matrix.target }}$'
          -fuzztime=15s -fuzzminimizetime=5s -parallel=2 -timeout=2m
      - name: Retain failing corpus
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-${{ matrix.target }}
          path: pkg/lint/testdata/fuzz/
          if-no-files-found: ignore

  collector-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: [0.110.0, 0.157.0]
        distribution: [core, contrib]
        include:
          - distribution: core
            binary: otelcol
          - distribution: contrib
            binary: otelcol-contrib
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.25
      - name: Download and verify the pinned Collector
        env:
          VERSION: ${{ matrix.version }}
          BINARY: ${{ matrix.binary }}
        run: |
          cd "$RUNNER_TEMP"
          archive="${BINARY}_${VERSION}_linux_amd64.tar.gz"
          release="https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/v${VERSION}"
          curl --fail --location --retry 3 "$release/$archive" --output "$archive"
          curl --fail --location --retry 3 \
            "$release/opentelemetry-collector-releases_${BINARY}_checksums.txt" --output checksums.txt
          grep " ${archive}$" checksums.txt | sha256sum --check -
          tar -xzf "$archive" "$BINARY"
      - name: Compare lint results with Collector validation
        env:
          OTELCOL_BINARY: ${{ runner.temp }}/${{ matrix.binary }}
          OTELCOL_VERSION: v${{ matrix.version }}
          OTELCOL_DISTRIBUTION: ${{ matrix.distribution }}
        run: |
          go test -race -tags=integration ./pkg/cmd/otelcol-config-lint \
            -run CollectorCompatibility -count=1 -v 2>&1 | tee "$RUNNER_TEMP/collector-compatibility.log"
      - name: Retain compatibility results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collector-compatibility-${{ matrix.distribution }}-${{ matrix.version }}
          path: ${{ runner.temp }}/collector-compatibility.log

  schemas:
    # The schemas are generated, so a hand edit that does not match what
    # schemagen produces would silently change what every config is checked
    # against.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.25
      - name: Check the schema fixture is readable and consistent
        run: |
          # The published registry lives in otelcol-config-schemas; what this
          # job checks is that the committed fixture still parses and drives
          # the rules, in both the layout and the formats the registry serves.
          go run ./cmd/otelcol-config-lint list versions --schema-location testdata/schemas
          jq -r '.distributions | to_entries[] | .key as $d | .value[] | "\($d) \(.)"' \
            testdata/schemas/index.json |
          while read -r distribution version; do
            go run ./cmd/otelcol-config-lint run \
              --schema-location "testdata/schemas" --distribution "${distribution}" \
              --collector-version "${version}" --min-severity error \
              --ignore-missing-schemas testdata/valid
          done
