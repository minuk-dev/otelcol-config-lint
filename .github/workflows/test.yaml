name: test

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # octocov posts the coverage report as a PR comment
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.25
      - name: Run unit tests
        run: make test
      - name: Report coverage (octocov)
        uses: k1LoW/octocov-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  schemas:
    # The schemas are generated, so a hand edit that does not match what
    # schemagen produces would silently change what every config is checked
    # against.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.25
      - name: Check the schemas are readable and consistent
        run: |
          go run ./cmd/otelcol-config-lint list versions --schema-location schemas
          # The index is the authoritative list, so this survives a layout
          # change. Every distribution and format is read from disk rather than
          # from the built-ins: the generated files are what this job checks.
          # The fixture is not written for every distribution -- core does not
          # ship what it uses -- so missing schemas are tolerated here. What is
          # being checked is that each generated file parses and drives the
          # rules, not that one config suits every binary.
          jq -r '.distributions | to_entries[] | .key as $d | .value[] | "\($d) \(.)"' \
            schemas/index.json |
          while read -r distribution version; do
            for format in yaml json; do
              go run ./cmd/otelcol-config-lint run \
                --schema-location "schemas/${distribution}/${version}.${format}" \
                --collector-version "${version}" --min-severity error \
                --ignore-missing-schemas testdata/valid
            done
          done
