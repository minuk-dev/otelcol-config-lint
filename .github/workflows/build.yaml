name: build

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.25
      # A snapshot build exercises every target the release will produce, so a
      # broken .goreleaser.yaml fails here rather than on a tag.
      - name: Build all release targets
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: build --snapshot --clean
      # -X against a symbol that does not exist is ignored by the linker
      # without a warning, so ldflags left pointing at a package that moved
      # ships a binary reporting "dev" and nothing notices. Read the version
      # back out of what was just built, once per build path.
      - name: Check the release build stamps the version
        run: |
          version="$(jq -r '.version' dist/metadata.json)"
          binary="$(jq -r 'first(.[] | select(.type == "Binary" and .goos == "linux" and .goarch == "amd64")).path' dist/artifacts.json)"
          got="$("${binary}" version)"
          want="otelcol-config-lint ${version}"
          if [ "${got}" != "${want}" ]; then
            echo "the version stamp did not land: got \"${got}\", want \"${want}\"" >&2
            echo 'check that the .goreleaser.yaml ldflags name the package Version lives in' >&2
            exit 1
          fi
      - name: Check the Makefile build stamps the version
        run: make verify-version
      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: otelcol-config-lint-snapshot
          path: dist/**/otelcol-config-lint*
          retention-days: 7

  self-lint:
    # The linter checks its own example configs and annotates the pull request
    # with anything it finds.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.25
      - name: Lint the example configs
        # The committed fixture, not the published registry: a pull request has
        # to be linted against schemas it carries, not against another repo's
        # current state.
        run: |
          go run ./cmd/otelcol-config-lint run --schema-location testdata/schemas \
            --output github --summary testdata/valid
