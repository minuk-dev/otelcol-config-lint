name: action

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  action:
    # The action is used the way a consumer would use it, so a broken
    # action.yml, Dockerfile or entrypoint fails here rather than in somebody
    # else's workflow.
    #
    # Every step points schema-location at the committed fixture, for the same
    # reason the self-lint job does: a pull request has to be checked against
    # the schemas it carries, not against another repository's current state.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.25

      # The action's image is assembled from the linter image of the release it
      # is pinned to, and a pull request predates that release -- on a tag the
      # pin resolves, here it cannot. So the same image is built from this
      # revision and the pin rewritten to it: every step below then exercises
      # action.yml, the Dockerfile and the entrypoint as committed, against the
      # linter as it stands on this branch rather than as it was last released.
      - name: Build the linter image from this revision
        run: |
          mkdir -p dist/action
          CGO_ENABLED=0 go build -ldflags '-s -w' \
            -o dist/action/otelcol-config-lint ./cmd/otelcol-config-lint

          # dist/action as the context, the way goreleaser builds it: the image
          # is the binary and nothing else.
          docker build -t otelcol-config-lint:source \
            -f build/docker/Dockerfile dist/action

          sed -i -E \
            's|^FROM ghcr\.io/minuk-dev/otelcol-config-lint:[^ ]*|FROM otelcol-config-lint:source|' \
            Dockerfile
          git --no-pager diff -- Dockerfile

      - name: Boolean and string inputs override settings only when explicit
        run: PATH="$PWD/dist/action:$PATH" bash build/docker/action-entrypoint_test.sh

      - name: Write a repository policy with strict enabled
        run: |
          printf 'run:\n  strict: true\nrules:\n  default: none\n  enable: [unknown-field]\n' \
            >.action-policy.yaml

      - name: An omitted boolean input inherits repository policy
        id: inherited-strict
        continue-on-error: true
        uses: ./
        with:
          files: testdata/rules/unknown-field.yaml
          config: .action-policy.yaml
          collector-version: v0.157.0
          schema-location: testdata/schemas
          output: json

      - name: Explicit false overrides repository policy
        id: false-strict
        uses: ./
        with:
          files: testdata/rules/unknown-field.yaml
          config: .action-policy.yaml
          collector-version: v0.157.0
          schema-location: testdata/schemas
          strict: false
          output: json

      - name: The action distinguishes omitted and false boolean inputs
        run: |
          test "${{ steps.inherited-strict.outcome }}" = "failure"
          test "${{ steps.inherited-strict.outputs.exit-code }}" = "1"
          test "${{ steps.inherited-strict.outputs.invalid }}" = "1"
          test "${{ steps.false-strict.outputs.exit-code }}" = "0"
          test "${{ steps.false-strict.outputs.valid }}" = "1"
          test "${{ steps.false-strict.outputs.warnings }}" = "1"

      - name: File summary lists each result
        run: |
          summary_file=$(mktemp)
          outputs_file=$(mktemp)
          if PATH="$PWD/dist/action:$PATH" GITHUB_OUTPUT="$outputs_file" GITHUB_STEP_SUMMARY="$summary_file" \
            bash build/docker/action-entrypoint.sh \
              '--files=testdata/valid testdata/invalid' \
              '--collector-version=v0.157.0' \
              '--schema-location=testdata/schemas' \
              '--output=text' '--file-summary=true' >/dev/null; then
            exit 1
          else
            test "$?" -eq 1
          fi
          grep -Fqx '| <code>testdata/valid/agent.yaml</code> | valid |' "$summary_file"
          grep -Fqx '| <code>testdata/invalid/pipeline.yaml</code> | invalid |' "$summary_file"
          grep -Fqx 'invalid=2' "$outputs_file"

          # A large report must still upload its summary, with failures first.
          mock_dir=$(mktemp -d)
          jq -n '{files: ([range(0; 15000) | {filename: ("configs/" + ("x" * 70) + tostring + ".yaml"), status: "valid"}] + [{filename: "configs/critical.yaml", status: "invalid"}]), summary: {valid: 15000, invalid: 1}}' >"$mock_dir/report.json"
          printf '#!/bin/sh\ncat "$FAKE_REPORT"\nexit 1\n' >"$mock_dir/otelcol-config-lint"
          chmod +x "$mock_dir/otelcol-config-lint"
          PATH="$mock_dir:$PATH" FAKE_REPORT="$mock_dir/report.json" \
            GITHUB_OUTPUT="$mock_dir/outputs" GITHUB_STEP_SUMMARY="$mock_dir/summary" \
            bash build/docker/action-entrypoint.sh \
              '--files=unused.yaml' '--collector-version=latest' \
              '--output=json' '--file-summary=true' >/dev/null || test "$?" -eq 1
          test "$(wc -c <"$mock_dir/summary")" -le 1048576
          grep -Fqx '| <code>configs/critical.yaml</code> | invalid |' "$mock_dir/summary"
          grep -q 'more file(s) omitted' "$mock_dir/summary"

      - name: Lint the valid examples
        id: valid
        uses: ./
        with:
          files: testdata/valid
          collector-version: v0.157.0
          schema-location: testdata/schemas
          file-summary: true

      - name: A passing run reports zero failures
        run: |
          test "${{ steps.valid.outputs.exit-code }}" = "0"
          test "${{ steps.valid.outputs.valid }}" = "1"
          test "${{ steps.valid.outputs.invalid }}" = "0"
          test "${{ steps.valid.outputs.errors }}" = "0"

      - name: Lint the invalid examples
        id: invalid
        continue-on-error: true
        uses: ./
        with:
          files: testdata/invalid
          collector-version: v0.157.0
          schema-location: testdata/schemas
          file-summary: true
          # Text, not annotations: these files are meant to be broken, and
          # annotating them would put red marks on every pull request.
          output: text

      - name: A failing run fails the step and reports the counts
        run: |
          test "${{ steps.invalid.outcome }}" = "failure"
          test "${{ steps.invalid.outputs.exit-code }}" = "1"
          test "${{ steps.invalid.outputs.invalid }}" = "2"
          test "${{ steps.invalid.outputs.valid }}" = "0"

      # The json output is the one path that reads the report file back out
      # rather than re-running the linter, so it is what covers the temporary
      # file the entrypoint draws per run and removes on the way out.
      - name: A JSON run prints the report and still reports the counts
        id: json
        uses: ./
        with:
          files: testdata/valid
          collector-version: v0.157.0
          schema-location: testdata/schemas
          output: json

      - name: The counts are the same whichever format was asked for
        run: |
          test "${{ steps.json.outputs.exit-code }}" = "0"
          test "${{ steps.json.outputs.valid }}" = "1"
          test "${{ steps.json.outputs.invalid }}" = "0"

      - name: A rule that is turned off is not reported
        id: disabled
        uses: ./
        with:
          files: testdata/invalid/pipeline.yaml
          collector-version: v0.157.0
          schema-location: testdata/schemas
          output: text
          # Everything pipeline.yaml is invalid for, so it comes back clean.
          disable: connector-wiring,invalid-pipeline-key,empty-pipeline
          min-severity: error

      - name: Turning the rules off makes the run pass
        run: test "${{ steps.disabled.outputs.exit-code }}" = "0"

      - name: The distribution decides what a component means
        id: distribution
        continue-on-error: true
        uses: ./
        with:
          files: testdata/valid
          collector-version: v0.157.0
          # The same file, against a binary that does not carry batch,
          # memory_limiter, debug or zpages: valid on contrib, invalid here.
          distribution: otlp
          schema-location: testdata/schemas
          output: text

      - name: Changing the distribution changes the verdict
        run: |
          test "${{ steps.distribution.outputs.exit-code }}" = "1"
          test "${{ steps.distribution.outputs.invalid }}" = "1"

      - name: A bad input is a usage error, not a lint failure
        id: usage
        continue-on-error: true
        uses: ./
        with:
          files: testdata/valid
          schema-location: testdata/schemas
          disable: no-such-rule

      - name: A usage error exits 2
        run: |
          test "${{ steps.usage.outcome }}" = "failure"
          test "${{ steps.usage.outputs.exit-code }}" = "2"

      - name: An unknown output format is a usage error as well
        id: bad-output
        continue-on-error: true
        uses: ./
        with:
          files: testdata/valid
          schema-location: testdata/schemas
          output: xml

      - name: A format the linter does not know exits 2
        run: |
          test "${{ steps.bad-output.outcome }}" = "failure"
          test "${{ steps.bad-output.outputs.exit-code }}" = "2"
