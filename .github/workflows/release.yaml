name: release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Bump then tag: the commit being released has to pin the action's image
      # at the release it is about to publish. If it names anything else,
      # `uses: minuk-dev/otelcol-config-lint@v1` would run a different revision
      # of the linter than the tag says -- and the fix, once the tag is out
      # there, is another release. Cheaper to refuse the tag.
      - name: The action has to be pinned at the release being cut
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # goreleaser publishes {{ .Version }}, which carries no leading v.
          expected="${GITHUB_REF_NAME#v}"
          pinned="$(sed -nE 's|^FROM ghcr\.io/minuk-dev/otelcol-config-lint:([^ ]+).*|\1|p' Dockerfile)"

          if [ "${pinned}" != "${expected}" ]; then
            echo "::error title=release::${GITHUB_REF_NAME} pins the action at" \
              "'${pinned}', expected '${expected}'." \
              "Run 'make release-pin RELEASE=${GITHUB_REF_NAME}', commit, and tag that commit."
            exit 1
          fi

          echo "${GITHUB_REF_NAME} pins the action at ${pinned}"
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.25
      - name: Set flags based on ref type
        run: |
          if [[ "${{ github.ref }}" != refs/tags/v* ]]; then
            echo "flags=--snapshot" >> $GITHUB_ENV
          fi
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean ${{ env.flags }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: goreleaser-assets
          path: dist/*

      # A snapshot build does not publish, so push its images by hand to keep
      # ghcr.io tracking main between releases.
      - name: Extract version
        if: startsWith(github.ref, 'refs/heads/')
        run: echo "VERSION=$(jq -r '.version' dist/metadata.json)" >> $GITHUB_ENV
      - name: Push snapshot images and create the multi-arch manifest
        if: startsWith(github.ref, 'refs/heads/')
        run: |
          jq -r '.[] | select(.type == "Docker Image") | .name' dist/artifacts.json > image_list.txt
          cat image_list.txt
          while IFS= read -r image; do
            echo "Pushing ${image}"
            docker push "${image}"
          done < image_list.txt

          AMD64_IMAGE="ghcr.io/minuk-dev/otelcol-config-lint:${VERSION}-amd64"
          ARM64_IMAGE="ghcr.io/minuk-dev/otelcol-config-lint:${VERSION}-arm64"
          MANIFEST_TAG="ghcr.io/minuk-dev/otelcol-config-lint:${VERSION}"

          echo "Creating multi-arch manifest: ${MANIFEST_TAG}"
          docker buildx imagetools create -t "${MANIFEST_TAG}" "${AMD64_IMAGE}" "${ARM64_IMAGE}"

  major-tag:
    # Actions convention: `uses: minuk-dev/otelcol-config-lint@v1` has to follow
    # the newest v1.x.y, so the major tag is moved once the release succeeded.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Move the major tag to this release
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          echo "Moving ${major} to ${GITHUB_REF_NAME}"
          git tag -f "${major}" "${GITHUB_REF_NAME}"
          git push -f origin "refs/tags/${major}"
