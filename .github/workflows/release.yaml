name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (vMAJOR.MINOR.PATCH, for example v0.2.1)'
        required: true
        type: string
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && 'manual' || github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_type == 'tag' && github.ref_name || '' }}

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.25
      - name: Check module files before tagging
        run: go mod tidy -diff
      # GITHUB_TOKEN pushes do not trigger another workflow; this run builds
      # the tag itself after this job succeeds.
      - name: Pin the Action image, commit and tag the release
        run: bash build/release.sh "$RELEASE_TAG"

  goreleaser:
    needs: prepare
    if: ${{ !cancelled() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version || github.ref }}
          fetch-depth: 0
      # Bump then tag: the commit being released has to pin the action's image
      # at the release it is about to publish. If it names anything else,
      # `uses: minuk-dev/otelcol-config-lint@v1` would run a different revision
      # of the linter than the tag says -- and the fix, once the tag is out
      # there, is another release. Cheaper to refuse the tag.
      - name: The action has to be pinned at the release being cut
        if: env.RELEASE_TAG != ''
        run: |
          # goreleaser publishes {{ .Version }}, which carries no leading v.
          expected="${RELEASE_TAG#v}"
          pinned="$(sed -nE 's|^FROM ghcr\.io/minuk-dev/otelcol-config-lint:([^ ]+).*|\1|p' Dockerfile)"

          if [ "${pinned}" != "${expected}" ]; then
            echo "::error title=release::${RELEASE_TAG} pins the action at" \
              "'${pinned}', expected '${expected}'." \
              "Run 'make release-pin RELEASE=${RELEASE_TAG}', commit, and tag that commit."
            exit 1
          fi

          echo "${RELEASE_TAG} pins the action at ${pinned}"
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.25
      - name: Set flags based on ref type
        run: |
          if [ -z "$RELEASE_TAG" ]; then
            echo "flags=--snapshot" >> "$GITHUB_ENV"
          fi
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean ${{ env.flags }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: goreleaser-assets
          path: dist/*

      # Pull from the registry even though GoReleaser left local build images.
      # Run the resolved digest so every check exercises the same published bytes.
      - name: Pull the published release image
        if: env.RELEASE_TAG != ''
        run: |
          pinned="$(sed -nE 's|^FROM ghcr\.io/minuk-dev/otelcol-config-lint:([^ ]+).*|\1|p' Dockerfile)"
          image="ghcr.io/minuk-dev/otelcol-config-lint:${pinned}"

          docker pull --platform linux/amd64 "${image}"
          digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "${image}")"
          echo "Testing ${image} as ${digest}"
          echo "OTELCOL_LINT_IMAGE=${digest}" >> "$GITHUB_ENV"

      - name: Exercise the published image with mounted fixtures
        if: env.RELEASE_TAG != ''
        env:
          OTELCOL_LINT_VERSION: ${{ env.RELEASE_TAG }}
        run: go test -tags=integration ./test/smoke -count=1 -v

      # A snapshot build does not publish, so push its images by hand to keep
      # ghcr.io tracking main between releases.
      - name: Extract version
        if: env.RELEASE_TAG == ''
        run: echo "VERSION=$(jq -r '.version' dist/metadata.json)" >> "$GITHUB_ENV"
      - name: Push snapshot images and create the multi-arch manifest
        if: env.RELEASE_TAG == ''
        run: |
          jq -r '.[] | select(.type == "Docker Image") | .name' dist/artifacts.json > image_list.txt
          cat image_list.txt
          while IFS= read -r image; do
            echo "Pushing ${image}"
            docker push "${image}"
          done < image_list.txt

          AMD64_IMAGE="ghcr.io/minuk-dev/otelcol-config-lint:${VERSION}-amd64"
          ARM64_IMAGE="ghcr.io/minuk-dev/otelcol-config-lint:${VERSION}-arm64"
          MANIFEST_TAG="ghcr.io/minuk-dev/otelcol-config-lint:${VERSION}"

          echo "Creating multi-arch manifest: ${MANIFEST_TAG}"
          docker buildx imagetools create -t "${MANIFEST_TAG}" "${AMD64_IMAGE}" "${ARM64_IMAGE}"

  major-tag:
    # Actions convention: `uses: minuk-dev/otelcol-config-lint@v<major>` has to
    # follow the newest release with that major, so the tag is moved once the
    # release succeeded. It is whatever the tag's own major is -- v0 while the
    # releases are 0.x, and v1 from 1.0.0 on -- so the README documents the one
    # that currently exists rather than the one it would like to.
    if: ${{ !cancelled() && needs.goreleaser.result == 'success' && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')) }}
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version || github.ref }}
          fetch-depth: 0
      - name: Move the major tag to this release
        run: |
          major="${RELEASE_TAG%%.*}"
          echo "Moving ${major} to ${RELEASE_TAG}"
          git tag -f "${major}" "${RELEASE_TAG}"
          git push -f origin "refs/tags/${major}"
