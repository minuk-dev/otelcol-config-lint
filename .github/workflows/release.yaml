name: release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.25
      - name: Set flags based on ref type
        run: |
          if [[ "${{ github.ref }}" != refs/tags/v* ]]; then
            echo "flags=--snapshot" >> $GITHUB_ENV
          fi
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean ${{ env.flags }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: goreleaser-assets
          path: dist/*

      # A snapshot build does not publish, so push its images by hand to keep
      # ghcr.io tracking main between releases.
      - name: Extract version
        if: startsWith(github.ref, 'refs/heads/')
        run: echo "VERSION=$(jq -r '.version' dist/metadata.json)" >> $GITHUB_ENV
      - name: Push snapshot images and create the multi-arch manifest
        if: startsWith(github.ref, 'refs/heads/')
        run: |
          jq -r '.[] | select(.type == "Docker Image") | .name' dist/artifacts.json > image_list.txt
          cat image_list.txt
          while IFS= read -r image; do
            echo "Pushing ${image}"
            docker push "${image}"
          done < image_list.txt

          AMD64_IMAGE="ghcr.io/minuk-dev/otelcol-config-lint:${VERSION}-amd64"
          ARM64_IMAGE="ghcr.io/minuk-dev/otelcol-config-lint:${VERSION}-arm64"
          MANIFEST_TAG="ghcr.io/minuk-dev/otelcol-config-lint:${VERSION}"

          echo "Creating multi-arch manifest: ${MANIFEST_TAG}"
          docker buildx imagetools create -t "${MANIFEST_TAG}" "${AMD64_IMAGE}" "${ARM64_IMAGE}"
