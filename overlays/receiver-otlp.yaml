# Field schema for the OTLP receiver.
# Source: opentelemetry-collector/receiver/otlpreceiver/config.go
kind: receiver
type: otlp
fields:
  type: map
  required:
    - protocols
  children:
    protocols:
      type: map
      doc: at least one of grpc or http must be enabled
      children:
        grpc:
          type: map
          children:
            endpoint: {type: string, doc: "host:port to listen on, e.g. 0.0.0.0:4317"}
            transport: {type: string, enum: [tcp, tcp4, tcp6, udp, udp4, udp6, ip, ip4, ip6, unix, unixgram, unixpacket]}
            tls:
              type: map
              children:
                ca_file: {type: string}
                ca_pem: {type: string}
                cert_file: {type: string}
                cert_pem: {type: string}
                key_file: {type: string}
                key_pem: {type: string}
                min_version: {type: string}
                max_version: {type: string}
                cipher_suites: {type: list, children: {item: {type: string}}}
                client_ca_file: {type: string}
                client_ca_file_reload: {type: bool}
                reload_interval: {type: duration}
                include_system_ca_certs_pool: {type: bool}
            max_recv_msg_size_mib: {type: int}
            max_concurrent_streams: {type: int}
            read_buffer_size: {type: int}
            write_buffer_size: {type: int}
            include_metadata: {type: bool}
            keepalive:
              type: map
              children:
                server_parameters:
                  type: map
                  children:
                    max_connection_idle: {type: duration}
                    max_connection_age: {type: duration}
                    max_connection_age_grace: {type: duration}
                    time: {type: duration}
                    timeout: {type: duration}
                enforcement_policy:
                  type: map
                  children:
                    min_time: {type: duration}
                    permit_without_stream: {type: bool}
            auth:
              type: map
              children:
                authenticator: {type: string, doc: id of an authenticator extension}
        http:
          type: map
          children:
            endpoint: {type: string, doc: "host:port to listen on, e.g. 0.0.0.0:4318"}
            tls:
              type: map
              children:
                ca_file: {type: string}
                ca_pem: {type: string}
                cert_file: {type: string}
                cert_pem: {type: string}
                key_file: {type: string}
                key_pem: {type: string}
                min_version: {type: string}
                max_version: {type: string}
                cipher_suites: {type: list, children: {item: {type: string}}}
                client_ca_file: {type: string}
                client_ca_file_reload: {type: bool}
                reload_interval: {type: duration}
                include_system_ca_certs_pool: {type: bool}
            cors:
              type: map
              children:
                allowed_origins: {type: list, children: {item: {type: string}}}
                allowed_headers: {type: list, children: {item: {type: string}}}
                max_age: {type: int}
            max_request_body_size: {type: int}
            include_metadata: {type: bool}
            compression_algorithms: {type: list, children: {item: {type: string}}}
            response_headers: {type: map, open: true}
            traces_url_path: {type: string}
            metrics_url_path: {type: string}
            logs_url_path: {type: string}
            auth:
              type: map
              children:
                authenticator: {type: string}
