# Field schema for the batch processor.
# Source: opentelemetry-collector/processor/batchprocessor/config.go
kind: processor
type: batch
fields:
  type: map
  children:
    send_batch_size:
      type: int
      doc: number of spans, metric data points or log records per batch
    send_batch_max_size:
      type: int
      doc: hard upper bound on a batch; must be >= send_batch_size when set
    timeout:
      type: duration
      doc: how long to wait before sending a batch that is not yet full
    metadata_keys:
      type: list
      children:
        item:
          type: string
      doc: client metadata keys that get their own batcher
    metadata_cardinality_limit:
      type: int
      doc: maximum number of distinct metadata_keys combinations
